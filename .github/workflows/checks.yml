name: Middleware checks

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        description: Version tag when called by the upstream release workflow
        type: string
        default: ''
    outputs:
      release_tag:
        description: Tag of the packaged and tested assets
        value: ${{ jobs.packages.outputs.release_tag }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Test config and runtime without live services
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r middleware/requirements.txt -r tests/requirements.txt
          python -m pip check
          python -m unittest discover -s tests
          python -m pytest -q middleware/test_runtime_security.py middleware/test_side_operations.py
          for script in scripts/bootstrap-release.sh scripts/bootstrap-vps.sh scripts/install-vps.sh middleware/start.sh scripts/stop.sh; do
            bash -n "$script"
          done

  packages:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PACKAGE_TAG: ${{ inputs.release_tag || 'v0.0.0' }}
    outputs:
      release_tag: ${{ steps.package.outputs.release_tag }}
    steps:
      # Keep the release builder separate from the test dependency environment.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Build the release assets from this commit
        id: package
        run: |
          output="$RUNNER_TEMP/release-assets"
          python scripts/package_release.py --commit "$GITHUB_SHA" --tag "$PACKAGE_TAG" --output "$output"
          (cd "$output" && sha256sum --check --strict SHA256SUMS)
          bash -n "$output/install-linux-vps.sh"
          mkdir -- "$RUNNER_TEMP/release-smoke"
          tar -xzf "$output/Arma-AI-War-Godmode-$PACKAGE_TAG-linux-vps.tar.gz" \
            --strip-components=1 -C "$RUNNER_TEMP/release-smoke"
          printf 'release_tag=%s\n' "$PACKAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Install from the release bundle and confirm the private defaults
        working-directory: ${{ runner.temp }}/release-smoke
        run: |
          chmod 0600 middleware/server.py middleware/dashboard.html
          bash scripts/install-vps.sh
          test "$(docker compose --env-file middleware/.env port middleware 8000)" = '127.0.0.1:8080'
          test "$(curl -fsS http://127.0.0.1:8080/health)" = '{"status":"ok"}'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health)" = 401
          docker compose --env-file middleware/.env exec -T middleware python -c 'import os; assert os.getuid() == 10001 and os.environ["GODMODE_RECORD_REPLAYS"] == "false"'
          bash scripts/stop.sh
      - name: Stop the isolated test stack
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/release-smoke/middleware/.env" ]; then
            cd -- "$RUNNER_TEMP/release-smoke"
            docker compose --env-file middleware/.env logs --tail=50 middleware
            docker compose --env-file middleware/.env down --volumes
          fi
      - name: Retain the tested assets for this upstream main run only
        if: ${{ inputs.release_tag != '' && github.repository_id == '1272470462' && github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
