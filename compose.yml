name: godmode-middleware

services:
  middleware:
    build:
      context: ./middleware
    ports:
      - target: 8000
        published: "${GODMODE_PORT:-8080}"
        host_ip: "127.0.0.1"
        protocol: tcp
    environment:
      - GODMODE_API_KEY=${GODMODE_API_KEY:?Set GODMODE_API_KEY in middleware/.env}
      - GODMODE_GAME_API_KEY=${GODMODE_GAME_API_KEY:?Set GODMODE_GAME_API_KEY in middleware/.env}
      - GODMODE_STATE_DIR=/var/lib/godmode
      - GODMODE_RECORD_REPLAYS=${GODMODE_RECORD_REPLAYS:-false}
      - RCON_ENABLED=false
      - RCON_ALLOW_SHUTDOWN=false
      - SERVER_CONTROL_ENABLED=false
      - CORS_ORIGINS=
      - LLM_PROVIDER=${LLM_PROVIDER:-disabled}
      - LLM_MODEL
      - FALLBACK_PROVIDER
      - FALLBACK_MODEL
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GLM_API_KEY
      - GLM_BASE_URL
      - GLM_TEMPERATURE
      - OPENROUTER_API_KEY
      - OPENROUTER_BASE_URL
      - OLLAMA_BASE_URL
      - LLM_MAX_TOKENS
      - LLM_RATE_LIMIT_RPM
      - AGENTS_ENABLED
      - MAX_HISTORY
      - MAX_CONCURRENT_LLM
      - MAX_MEMORY_MESSAGES
      - MEMORY_TOKEN_LIMIT
      - COMPACTION_THRESHOLD
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    volumes:
      - middleware-state:/var/lib/godmode
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-c", "from http.client import HTTPConnection; c = HTTPConnection('127.0.0.1', 8000, timeout=3); c.request('GET', '/health'); raise SystemExit(c.getresponse().status != 200)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  middleware-state:
