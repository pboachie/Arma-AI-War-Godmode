services:
  arma-server:
    build:
      context: .
      dockerfile: Dockerfile.arma
    network_mode: host
    environment:
      - CONFIG=${CONFIG:-config}
      - MAX_FPS=${MAX_FPS:-60}
      - MAX_RESTARTS=${MAX_RESTARTS:-0}
      - FREEZE_CHECK=${FREEZE_CHECK:-300}
      - USE_EXPERIMENTAL=${USE_EXPERIMENTAL:-false}
      - STARTUP_PARAMETERS=${STARTUP_PARAMETERS:-}
      - STEAM_USER=${STEAM_USER:-}
      - STEAM_PASS=${STEAM_PASS:-}
      - ARMA_LOCAL_ADDON_ENABLED=${ARMA_LOCAL_ADDON_ENABLED:-true}
      - ARMA_LOCAL_ADDON_NAME=${ARMA_LOCAL_ADDON_NAME:-GodMode}
      - ARMA_LOCAL_ADDON_ID=${ARMA_LOCAL_ADDON_ID:-GodMode}
    volumes:
      - "../Arma Reforger Server/configs:/home/reforger/configs"
      - type: bind
        source: ${ARMA_LOCAL_SCRIPTS_SOURCE:-../scripts/Game}
        target: /mnt/godmode-source/scripts/Game
        read_only: true
      - type: bind
        source: ${ARMA_LOCAL_CONFIGS_SOURCE:-../Configs}
        target: /mnt/godmode-source/Configs
        read_only: true
      - arma-steamcmd:/home/reforger/steamcmd
      - arma-steam:/home/reforger/Steam
      - arma-install:/home/reforger/reforger_bins
      - arma-profile:/home/reforger/profile
      - arma-workshop:/home/reforger/workshop
    restart: unless-stopped

volumes:
  arma-steamcmd:
  arma-steam:
  arma-install:
  arma-profile:
  arma-workshop:
