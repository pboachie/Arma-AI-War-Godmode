[supervisord]
nodaemon=true
logfile=/home/reforger/supervisord.log
pidfile=/home/reforger/supervisord.pid
childlogdir=/home/reforger/logs

[unix_http_server]
file=/home/reforger/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///home/reforger/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:arma-server]
command=python3 /home/reforger/launch.py
directory=/home/reforger
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/home/reforger"

[program:middleware]
command=python3 -m hypercorn server:app --bind 0.0.0.0:8000
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/home/reforger"
