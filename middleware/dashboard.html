<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>God Mode — Command & Control</title>
<link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="12" fill="%230a0f0a"/%3E%3Cpath d="M32 10 50 24v16L32 54 14 40V24z" fill="none" stroke="%2300ff88" stroke-width="4"/%3E%3Ccircle cx="32" cy="32" r="6" fill="%2300ff88"/%3E%3C/svg%3E'>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0f0a; }
  button:hover { filter: brightness(1.3); }
  button:active { filter: brightness(0.9); transform: scale(0.98); }
  select:hover { border-color: rgba(0,255,136,0.35) !important; }
  input:focus, select:focus { border-color: rgba(0,255,136,0.4) !important; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0a0f0a; }
  ::-webkit-scrollbar-thumb { background: rgba(0,255,136,0.15); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,255,136,0.3); }
  ::selection { background: rgba(0,255,136,0.2); color: #ccddcc; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const API_BASE = window.location.origin;
const POLL_INTERVAL = 3000;
const STATUS_TIMEOUT = 3200;

// ── Utility ──
const fmt = (n) => (typeof n === "number" ? n.toFixed(1) : "\u2014");
const fmtTime = (s) => {
  if (!s && s !== 0) return "\u2014";
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  const sec = Math.floor(s % 60);
  if (h > 0) return `${h}h ${m % 60}m`;
  return `${m}m ${sec}s`;
};

const ts = (epoch) => {
  if (!epoch) return "\u2014";
  return new Date(epoch * 1000).toLocaleTimeString();
};

// ═══════════════════════════════════════════════
// COMPONENTS
// ═══════════════════════════════════════════════

function StatusDot({ state }) {
  const palette = {
    connected: { fill: "#00ff88", glow: "#00ff8866" },
    connecting: { fill: "#ffcc66", glow: "#ffcc6666" },
    offline: { fill: "#ff4444", glow: "#ff444466" },
  };
  const tone = palette[state] || palette.offline;
  return (
    <span
      style={{
        display: "inline-block",
        width: 8,
        height: 8,
        borderRadius: "50%",
        background: tone.fill,
        boxShadow: `0 0 6px ${tone.glow}`,
        marginRight: 8,
      }}
    />
  );
}

function StatCard({ label, value, sub, accent }) {
  return (
    <div
      style={{
        background: "rgba(0,255,136,0.03)",
        border: "1px solid rgba(0,255,136,0.12)",
        padding: "14px 18px",
        flex: 1,
        minWidth: 140,
      }}
    >
      <div style={{ fontSize: 11, color: "#667766", letterSpacing: 1.5, fontFamily: "JetBrains Mono", textTransform: "uppercase" }}>
        {label}
      </div>
      <div style={{ fontSize: 28, fontWeight: 700, color: accent || "#00ff88", fontFamily: "Rajdhani", marginTop: 2, lineHeight: 1 }}>
        {value}
      </div>
      {sub && <div style={{ fontSize: 11, color: "#556655", fontFamily: "JetBrains Mono", marginTop: 4 }}>{sub}</div>}
    </div>
  );
}

function SectionHeader({ children }) {
  return (
    <div
      style={{
        fontSize: 11,
        letterSpacing: 2,
        color: "#00ff88",
        fontFamily: "JetBrains Mono",
        textTransform: "uppercase",
        borderBottom: "1px solid rgba(0,255,136,0.15)",
        paddingBottom: 6,
        marginBottom: 12,
        marginTop: 24,
      }}
    >
      \u25a0 {children}
    </div>
  );
}

function ActionStatus({ status }) {
  if (!status) return null;

  const tones = {
    success: {
      color: "#00ff88",
      background: "rgba(0,255,136,0.08)",
      border: "1px solid rgba(0,255,136,0.18)",
    },
    error: {
      color: "#ff6666",
      background: "rgba(255,68,68,0.08)",
      border: "1px solid rgba(255,68,68,0.22)",
    },
    info: {
      color: "#88bbff",
      background: "rgba(136,187,255,0.08)",
      border: "1px solid rgba(136,187,255,0.18)",
    },
  };

  const tone = tones[status.type] || tones.info;

  return (
    <div
      style={{
        marginTop: 12,
        padding: "8px 10px",
        fontSize: 11,
        fontFamily: "JetBrains Mono",
        lineHeight: 1.4,
        ...tone,
      }}
    >
      {status.message}
    </div>
  );
}

// ── LLM Health Indicator ──
function LLMHealthIndicator({ statsData }) {
  if (!statsData) return null;

  const retries = statsData.llm_retries || 0;
  const rate429 = statsData.llm_429s || 0;
  const circuitStatus = statsData.llm_circuit_status || "closed";
  const inflight = statsData.llm_inflight || 0;
  const maxConcurrent = statsData.llm_max_concurrent || 1;
  const consecutiveFailures = statsData.llm_consecutive_failures || 0;

  // Determine overall health: green/yellow/red
  let healthState = "healthy";
  let healthColor = "#00ff88";
  let healthGlow = "#00ff8844";
  let healthLabel = "HEALTHY";

  if (circuitStatus === "open") {
    healthState = "critical";
    healthColor = "#ff4444";
    healthGlow = "#ff444444";
    healthLabel = "CIRCUIT OPEN";
  } else if (circuitStatus === "half-open") {
    healthState = "recovering";
    healthColor = "#ffaa00";
    healthGlow = "#ffaa0044";
    healthLabel = "RECOVERING";
  } else if (consecutiveFailures > 0 || retries > 0) {
    healthState = "degraded";
    healthColor = "#ffcc66";
    healthGlow = "#ffcc6644";
    healthLabel = "RETRYING";
  }

  return (
    <div
      style={{
        background: "rgba(0,255,136,0.03)",
        border: `1px solid ${healthColor}33`,
        padding: "14px 18px",
      }}
    >
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
        <span
          style={{
            display: "inline-block",
            width: 10,
            height: 10,
            borderRadius: "50%",
            background: healthColor,
            boxShadow: `0 0 8px ${healthGlow}`,
            animation: healthState !== "healthy" ? "pulse 1.5s ease-in-out infinite" : "none",
          }}
        />
        <span style={{ fontSize: 11, letterSpacing: 1.5, fontFamily: "JetBrains Mono", color: healthColor, textTransform: "uppercase", fontWeight: 600 }}>
          LLM {healthLabel}
        </span>
      </div>
      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", fontSize: 11, fontFamily: "JetBrains Mono", color: "#667766" }}>
        <div>
          Retries: <span style={{ color: retries > 0 ? "#ffcc66" : "#556655" }}>{retries}</span>
        </div>
        <div>
          429s: <span style={{ color: rate429 > 0 ? "#ff8844" : "#556655" }}>{rate429}</span>
        </div>
        <div>
          Circuit: <span style={{ color: circuitStatus === "closed" ? "#00ff88" : circuitStatus === "open" ? "#ff4444" : "#ffaa00" }}>{circuitStatus}</span>
        </div>
        <div>
          In-flight: <span style={{ color: "#88bbff" }}>{inflight}/{maxConcurrent}</span>
        </div>
        {consecutiveFailures > 0 && (
          <div>
            Consecutive fails: <span style={{ color: "#ff4444" }}>{consecutiveFailures}</span>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Response Time Sparkline (CSS-only) ──
function ResponseTimeSparkline({ times }) {
  if (!times || times.length === 0) {
    return (
      <div style={{ fontSize: 11, fontFamily: "JetBrains Mono", color: "#445544" }}>
        No response time data yet
      </div>
    );
  }

  const maxVal = Math.max(...times, 1);
  const minVal = Math.min(...times);
  const avgVal = times.reduce((a, b) => a + b, 0) / times.length;
  const latest = times[times.length - 1];

  // Color the latest bar based on trend: compare to average
  const trendColor = latest > avgVal * 1.5 ? "#ff4444" : latest > avgVal * 1.1 ? "#ffcc66" : "#00ff88";

  return (
    <div style={{
      background: "rgba(0,255,136,0.03)",
      border: "1px solid rgba(0,255,136,0.12)",
      padding: "14px 18px",
    }}>
      <div style={{ fontSize: 11, color: "#667766", letterSpacing: 1.5, fontFamily: "JetBrains Mono", textTransform: "uppercase", marginBottom: 8 }}>
        Response Time Trend
      </div>
      <div style={{ display: "flex", alignItems: "flex-end", gap: 3, height: 40 }}>
        {times.map((t, i) => {
          const heightPct = Math.max((t / maxVal) * 100, 4);
          const isLatest = i === times.length - 1;
          const barColor = isLatest ? trendColor : "rgba(0,255,136,0.35)";
          return (
            <div
              key={i}
              title={`${t}ms`}
              style={{
                flex: 1,
                height: `${heightPct}%`,
                background: barColor,
                borderRadius: "1px 1px 0 0",
                minWidth: 6,
                transition: "height 0.3s ease",
              }}
            />
          );
        })}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, fontSize: 10, fontFamily: "JetBrains Mono", color: "#556655" }}>
        <span>min: <span style={{ color: "#889988" }}>{minVal}ms</span></span>
        <span>avg: <span style={{ color: "#889988" }}>{Math.round(avgVal)}ms</span></span>
        <span>latest: <span style={{ color: trendColor }}>{latest}ms</span></span>
      </div>
    </div>
  );
}

// ── Error Rate Display ──
function ErrorRateDisplay({ health }) {
  if (!health) return null;

  const totalReqs = health.total_requests || 0;
  const totalErrs = health.total_errors || 0;
  const errorRate = totalReqs > 0 ? (totalErrs / totalReqs) * 100 : 0;

  let rateColor = "#00ff88";
  let rateLabel = "NOMINAL";
  let rateBg = "rgba(0,255,136,0.06)";
  let rateBorder = "rgba(0,255,136,0.20)";

  if (errorRate > 10) {
    rateColor = "#ff4444";
    rateLabel = "CRITICAL";
    rateBg = "rgba(255,68,68,0.06)";
    rateBorder = "rgba(255,68,68,0.25)";
  } else if (errorRate >= 5) {
    rateColor = "#ffcc66";
    rateLabel = "ELEVATED";
    rateBg = "rgba(255,204,102,0.06)";
    rateBorder = "rgba(255,204,102,0.25)";
  }

  return (
    <div style={{
      background: rateBg,
      border: `1px solid ${rateBorder}`,
      padding: "14px 18px",
      flex: 1,
      minWidth: 140,
    }}>
      <div style={{ fontSize: 11, color: "#667766", letterSpacing: 1.5, fontFamily: "JetBrains Mono", textTransform: "uppercase" }}>
        Error Rate
      </div>
      <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginTop: 2 }}>
        <span style={{ fontSize: 28, fontWeight: 700, color: rateColor, fontFamily: "Rajdhani", lineHeight: 1 }}>
          {errorRate.toFixed(1)}%
        </span>
        <span style={{ fontSize: 10, fontFamily: "JetBrains Mono", color: rateColor, letterSpacing: 1, textTransform: "uppercase" }}>
          {rateLabel}
        </span>
      </div>
      <div style={{ fontSize: 11, color: "#556655", fontFamily: "JetBrains Mono", marginTop: 4 }}>
        {totalErrs} errors / {totalReqs} requests
      </div>
      {/* Error rate progress bar */}
      <div style={{ marginTop: 6, background: "rgba(0,255,136,0.08)", height: 4, borderRadius: 2, overflow: "hidden" }}>
        <div style={{
          width: `${Math.min(errorRate, 100)}%`,
          height: "100%",
          background: rateColor,
          borderRadius: 2,
          transition: "width 0.3s ease",
        }} />
      </div>
    </div>
  );
}

// ── Command Execution Log (recent 20) ──
function CommandExecutionLog({ commandLog }) {
  const logEndRef = useRef(null);
  const containerRef = useRef(null);
  const [autoScroll, setAutoScroll] = useState(true);
  const prevCountRef = useRef(0);

  // Flatten and take last 20 commands
  const recentCommands = [];
  for (let i = commandLog.length - 1; i >= 0 && recentCommands.length < 20; i--) {
    const batch = commandLog[i];
    const cmds = (batch.commands?.commands || []).map((cmd) => ({
      ...cmd,
      _ts: batch.timestamp,
      _source: batch.source || "llm",
      _response_time_ms: batch.response_time_ms,
    }));
    for (let j = cmds.length - 1; j >= 0 && recentCommands.length < 20; j--) {
      recentCommands.unshift(cmds[j]);
    }
  }

  // Auto-scroll on new entries
  useEffect(() => {
    if (autoScroll && recentCommands.length > prevCountRef.current && logEndRef.current) {
      logEndRef.current.scrollIntoView({ behavior: "smooth" });
    }
    prevCountRef.current = recentCommands.length;
  }, [recentCommands.length, autoScroll]);

  // Detect manual scroll
  const handleScroll = useCallback(() => {
    if (!containerRef.current) return;
    const el = containerRef.current;
    const isAtBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
    setAutoScroll(isAtBottom);
  }, []);

  // Color mapping by command category
  const getTypeColor = (type) => {
    if (!type) return "#667766";
    const t = type.toLowerCase();
    // Spawn commands: blue
    if (t.includes("spawn") || t.includes("reinforcement")) return "#4488ff";
    // Combat commands: red
    if (t === "attack" || t === "defend" || t === "set_ambush" || t === "seek_and_destroy") return "#ff4444";
    // Movement commands: green
    if (t === "move" || t === "patrol" || t === "retreat") return "#00ff88";
    // Effects commands: yellow
    if (t === "explosion" || t === "smoke" || t === "flare" || t === "thunder_near") return "#ffcc66";
    // Environment
    if (t.includes("weather") || t.includes("time") || t.includes("wind")) return "#88ddff";
    // Cleanup
    if (t.includes("cleanup") || t.includes("despawn")) return "#889988";
    return "#667766";
  };

  const getCategoryLabel = (type) => {
    if (!type) return "";
    const t = type.toLowerCase();
    if (t.includes("spawn") || t.includes("reinforcement")) return "SPAWN";
    if (t === "attack" || t === "defend" || t === "set_ambush" || t === "seek_and_destroy") return "COMBAT";
    if (t === "move" || t === "patrol" || t === "retreat") return "MOVE";
    if (t === "explosion" || t === "smoke" || t === "flare" || t === "thunder_near") return "EFFECT";
    if (t.includes("weather") || t.includes("time") || t.includes("wind")) return "ENV";
    if (t.includes("cleanup") || t.includes("despawn")) return "CLEAN";
    return "OTHER";
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
        <span style={{ fontSize: 10, fontFamily: "JetBrains Mono", color: "#556655" }}>
          Showing last {recentCommands.length} of 20 max
        </span>
        <span style={{
          fontSize: 9, fontFamily: "JetBrains Mono",
          color: autoScroll ? "#00ff88" : "#556655",
          letterSpacing: 0.5,
        }}>
          {autoScroll ? "AUTO-SCROLL ON" : "AUTO-SCROLL OFF"}
        </span>
      </div>
      <div
        ref={containerRef}
        onScroll={handleScroll}
        style={{
          maxHeight: 320,
          overflowY: "auto",
          border: "1px solid rgba(0,255,136,0.10)",
          background: "rgba(0,0,0,0.2)",
        }}
      >
        {recentCommands.length === 0 ? (
          <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono", padding: "16px 12px", textAlign: "center" }}>
            No commands executed yet
          </div>
        ) : (
          recentCommands.map((cmd, i) => {
            const typeColor = getTypeColor(cmd.command_type);
            const catLabel = getCategoryLabel(cmd.command_type);
            const narrative = cmd.narrative || "";
            const truncNarrative = narrative.length > 60 ? narrative.slice(0, 57) + "..." : narrative;
            const posStr = cmd.target_position
              ? (typeof cmd.target_position === "string" ? cmd.target_position : JSON.stringify(cmd.target_position))
              : "";

            return (
              <div
                key={i}
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 8,
                  padding: "5px 10px",
                  borderBottom: "1px solid rgba(0,255,136,0.05)",
                  fontSize: 11,
                  fontFamily: "JetBrains Mono",
                  borderLeft: `3px solid ${typeColor}`,
                }}
              >
                <span style={{ color: "#445544", width: 62, flexShrink: 0, fontSize: 10 }}>{ts(cmd._ts)}</span>
                <span style={{
                  fontSize: 8, padding: "1px 4px", letterSpacing: 0.5, fontWeight: 600,
                  background: `${typeColor}18`, color: typeColor, border: `1px solid ${typeColor}44`,
                  width: 48, textAlign: "center", flexShrink: 0,
                }}>
                  {catLabel}
                </span>
                <span style={{ color: typeColor, width: 120, flexShrink: 0, fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {cmd.command_type}
                </span>
                <span style={{ color: "#667766", width: 70, flexShrink: 0 }}>{cmd.unit_id || "\u2014"}</span>
                <span style={{ color: "#556655", width: 100, flexShrink: 0, fontSize: 10, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {posStr || "\u2014"}
                </span>
                <span style={{ color: "#556655", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", fontSize: 10, fontStyle: "italic" }}>
                  {truncNarrative || "\u2014"}
                </span>
              </div>
            );
          })
        )}
        <div ref={logEndRef} />
      </div>
    </div>
  );
}

function UnitRow({ unit }) {
  const hp = (unit.health_pct || 0) * 100;
  const hpColor = hp > 60 ? "#00ff88" : hp > 30 ? "#ffaa00" : "#ff4444";
  const orderColors = { patrol: "#00ff88", defend: "#ffaa00", attack: "#ff4444", move: "#00aaff" };
  const orderColor = orderColors[unit.current_order] || "#667766";
  const pos = Array.isArray(unit.position) ? `${unit.position[0]}, ${unit.position[2]}` : "\u2014";
  const statusColors = { completed: "#00ff88", executing: "#00aaff", stuck: "#ff4444", engaged: "#ffaa00" };
  const oStatus = unit.order_status || null;
  const oStatusColor = statusColors[oStatus] || "#556655";
  return (
    <div
      style={{
        padding: "6px 0",
        borderBottom: "1px solid rgba(0,255,136,0.06)",
        fontSize: 12,
        fontFamily: "JetBrains Mono",
      }}
    >
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <span style={{ color: "#00ff88", width: 80, flexShrink: 0 }}>{unit.unit_id}</span>
        <span style={{ color: "#889988", width: 100, flexShrink: 0 }}>{unit.unit_type}</span>
        <span style={{ color: orderColor, flexShrink: 0, fontSize: 11, width: 70 }}>{unit.current_order || "\u2014"}</span>
        <span style={{ color: "#667766", width: 50, flexShrink: 0 }}>str:{unit.strength || "?"}</span>
        <span style={{ color: "#556655", width: 120, flexShrink: 0, fontSize: 11 }}>{pos}</span>
        <div style={{ flex: 1, background: "rgba(0,255,136,0.08)", height: 4, borderRadius: 2, overflow: "hidden" }}>
          <div style={{ width: `${hp}%`, height: "100%", background: hpColor, borderRadius: 2 }} />
        </div>
        <span style={{ color: hpColor, width: 40, textAlign: "right", flexShrink: 0 }}>{hp.toFixed(0)}%</span>
      </div>
      {/* Extended unit info row */}
      <div style={{ display: "flex", gap: 16, paddingLeft: 80, marginTop: 2, fontSize: 10, color: "#556655" }}>
        {oStatus && (
          <span>status: <span style={{ color: oStatusColor }}>{oStatus}</span></span>
        )}
        {unit.distance_to_objective != null && (
          <span>obj dist: <span style={{ color: "#88bbff" }}>{Math.round(unit.distance_to_objective)}m</span></span>
        )}
        {unit.time_since_order != null && (
          <span>order age: <span style={{ color: "#889988" }}>{fmtTime(unit.time_since_order)}</span></span>
        )}
        {(unit.kills != null || unit.casualties != null) && (
          <span>
            {unit.kills != null && <><span style={{ color: "#ff4444" }}>{unit.kills}K</span> </>}
            {unit.casualties != null && <span style={{ color: "#ffaa00" }}>{unit.casualties}C</span>}
          </span>
        )}
      </div>
    </div>
  );
}

function CommandEntry({ cmd, index }) {
  const [expanded, setExpanded] = useState(false);
  const typeColors = {
    move: "#00aaff", attack: "#ff4444", defend: "#ffaa00", patrol: "#00ff88",
    spawn_infantry: "#aa88ff", spawn_vehicle: "#ff88aa", set_weather: "#88ddff",
    retreat: "#ffcc00", explosion: "#ff6600", smoke: "#aaaaaa",
  };
  const color = typeColors[cmd.command_type] || "#00ff88";

  return (
    <div
      style={{
        borderLeft: `2px solid ${color}`,
        padding: "6px 10px",
        marginBottom: 4,
        background: expanded ? "rgba(0,255,136,0.04)" : "transparent",
        cursor: "pointer",
        transition: "background 0.15s",
      }}
      onClick={() => setExpanded(!expanded)}
    >
      <div style={{ display: "flex", gap: 10, fontSize: 12, fontFamily: "JetBrains Mono", alignItems: "center" }}>
        {cmd._source === "manual" && (
          <span style={{ fontSize: 9, padding: "1px 5px", background: "rgba(255,170,0,0.15)", color: "#ffaa00", border: "1px solid rgba(255,170,0,0.3)", letterSpacing: 0.5, flexShrink: 0 }}>MAN</span>
        )}
        <span style={{ color, fontWeight: 600, width: 140, flexShrink: 0 }}>{cmd.command_type}</span>
        <span style={{ color: "#667766", width: 80, flexShrink: 0 }}>{cmd.unit_id || "\u2014"}</span>
        <span style={{ color: "#556655", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
          {cmd.narrative || (typeof cmd.parameters === "string" ? cmd.parameters : JSON.stringify(cmd.parameters)) || ""}
        </span>
        {cmd._ts && <span style={{ color: "#334433", fontSize: 10, flexShrink: 0 }}>{ts(cmd._ts)}</span>}
      </div>
      {expanded && (
        <div style={{ marginTop: 6, fontSize: 11, color: "#556655", fontFamily: "JetBrains Mono", lineHeight: 1.5 }}>
          {cmd.target_position && <div>Target: <span style={{ color: "#889988" }}>{typeof cmd.target_position === "string" ? cmd.target_position : JSON.stringify(cmd.target_position)}</span></div>}
          {cmd.parameters && <div>Params: <span style={{ color: "#889988" }}>{typeof cmd.parameters === "string" ? cmd.parameters : JSON.stringify(cmd.parameters)}</span></div>}
          {cmd.reasoning && <div>Reasoning: <span style={{ color: "#7799aa" }}>{cmd.reasoning}</span></div>}
          {cmd.narrative && <div>Narrative: <span style={{ color: "#aaaa77" }}>"{cmd.narrative}"</span></div>}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════
// MANUAL COMMAND PANEL
// ═══════════════════════════════════════════════

function ManualCommandPanel({ queueCommand, busy }) {
  const [cmdType, setCmdType] = useState("spawn_infantry");
  const [params, setParams] = useState("ussr_rifle_squad");
  const [pos, setPos] = useState("3500,0,4800");
  const [unitId, setUnitId] = useState("new");
  const [narrative, setNarrative] = useState("");
  const [status, setStatus] = useState("");
  const statusTimerRef = useRef(null);

  useEffect(() => {
    return () => {
      if (statusTimerRef.current) clearTimeout(statusTimerRef.current);
    };
  }, []);

  const send = async () => {
    const body = {
      commands: [{
        command_type: cmdType,
        unit_id: unitId,
        target_position: pos,
        parameters: params,
        narrative: narrative,
        reasoning: "manual_override",
      }],
      narrative_broadcast: "",
      weather_command: "",
      time_override: -1,
    };
    try {
      const data = await queueCommand(body, { busyKey: "manual" });
      setStatus(`\u2713 Queued ${data.command_count} command(s)`);
      if (statusTimerRef.current) clearTimeout(statusTimerRef.current);
      statusTimerRef.current = setTimeout(() => setStatus(""), STATUS_TIMEOUT);
    } catch (e) {
      setStatus(`\u2717 ${e.message}`);
      if (statusTimerRef.current) clearTimeout(statusTimerRef.current);
      statusTimerRef.current = setTimeout(() => setStatus(""), STATUS_TIMEOUT);
    }
  };

  const inputStyle = {
    background: "rgba(0,255,136,0.05)",
    border: "1px solid rgba(0,255,136,0.15)",
    color: "#ccddcc",
    padding: "6px 10px",
    fontSize: 12,
    fontFamily: "JetBrains Mono",
    outline: "none",
    width: "100%",
    boxSizing: "border-box",
  };

  const labelStyle = { fontSize: 10, color: "#556655", letterSpacing: 1, fontFamily: "JetBrains Mono", marginBottom: 3, textTransform: "uppercase" };

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <div>
          <div style={labelStyle}>Command Type</div>
          <select value={cmdType} onChange={(e) => setCmdType(e.target.value)} style={inputStyle}>
            <optgroup label="Movement">
              <option value="move">move</option>
              <option value="attack">attack</option>
              <option value="defend">defend</option>
              <option value="patrol">patrol</option>
              <option value="set_ambush">set_ambush</option>
              <option value="seek_and_destroy">seek_and_destroy</option>
              <option value="retreat">retreat</option>
            </optgroup>
            <optgroup label="Spawning">
              <option value="spawn_infantry">spawn_infantry</option>
              <option value="spawn_vehicle">spawn_vehicle</option>
              <option value="spawn_reinforcements">spawn_reinforcements</option>
            </optgroup>
            <optgroup label="Environment">
              <option value="set_weather">set_weather</option>
              <option value="set_time">set_time</option>
              <option value="set_wind">set_wind</option>
              <option value="thunder_near">thunder_near</option>
            </optgroup>
            <optgroup label="Effects">
              <option value="explosion">explosion</option>
              <option value="smoke">smoke</option>
              <option value="flare">flare</option>
            </optgroup>
            <optgroup label="Cleanup">
              <option value="cleanup_area">cleanup_area</option>
              <option value="cleanup_dead">cleanup_dead</option>
              <option value="despawn_unit">despawn_unit</option>
            </optgroup>
            <optgroup label="Narrative">
              <option value="radio_message">radio_message</option>
              <option value="objective_create">objective_create</option>
              <option value="objective_complete">objective_complete</option>
            </optgroup>
          </select>
        </div>
        <div>
          <div style={labelStyle}>Parameters</div>
          <input value={params} onChange={(e) => setParams(e.target.value)} style={inputStyle} placeholder="e.g. ussr_rifle_squad" />
        </div>
        <div>
          <div style={labelStyle}>Target Position (x,y,z)</div>
          <input value={pos} onChange={(e) => setPos(e.target.value)} style={inputStyle} placeholder="3500,0,4800" />
        </div>
        <div>
          <div style={labelStyle}>Unit ID</div>
          <input value={unitId} onChange={(e) => setUnitId(e.target.value)} style={inputStyle} placeholder="squad_1 or new" />
        </div>
        <div style={{ gridColumn: "span 2" }}>
          <div style={labelStyle}>Narrative (optional)</div>
          <input value={narrative} onChange={(e) => setNarrative(e.target.value)} style={inputStyle} placeholder="Flavor text shown to players" />
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 10 }}>
        <button
          onClick={send}
          disabled={busy}
          style={{
            background: "rgba(0,255,136,0.12)",
            border: "1px solid rgba(0,255,136,0.3)",
            color: "#00ff88",
            padding: "8px 24px",
            fontFamily: "JetBrains Mono",
            fontSize: 12,
            fontWeight: 600,
            cursor: busy ? "wait" : "pointer",
            letterSpacing: 1,
            textTransform: "uppercase",
            opacity: busy ? 0.6 : 1,
          }}
        >
          {busy ? "… Sending" : "\u25b8 Send Command"}
        </button>
        {status && <span style={{ fontSize: 12, color: status.startsWith("\u2713") ? "#00ff88" : "#ff4444", fontFamily: "JetBrains Mono" }}>{status}</span>}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// MAIN DASHBOARD
// ═══════════════════════════════════════════════

function Dashboard() {
  const [health, setHealth] = useState(null);
  const [gameState, setGameState] = useState(null);
  const [commandLog, setCommandLog] = useState([]);
  const [statsData, setStatsData] = useState(null);
  const [tacticalIntel, setTacticalIntel] = useState(null);
  const [connected, setConnected] = useState(false);
  const [hasLoadedOnce, setHasLoadedOnce] = useState(false);
  const [tab, setTab] = useState("overview");
  const [actionStatus, setActionStatus] = useState(null);
  const [busyAction, setBusyAction] = useState("");
  const serverUrl = API_BASE;
  const logRef = useRef(null);
  const actionStatusTimerRef = useRef(null);

  const showActionStatus = useCallback((type, message) => {
    if (actionStatusTimerRef.current) clearTimeout(actionStatusTimerRef.current);
    setActionStatus({ type, message });
    actionStatusTimerRef.current = setTimeout(() => setActionStatus(null), STATUS_TIMEOUT);
  }, []);

  useEffect(() => {
    return () => {
      if (actionStatusTimerRef.current) clearTimeout(actionStatusTimerRef.current);
    };
  }, []);

  const fetchJson = useCallback(async (path, options) => {
    const res = await fetch(`${serverUrl}${path}`, options);
    const contentType = res.headers.get("content-type") || "";
    const payload = contentType.includes("application/json") ? await res.json() : { detail: await res.text() };
    if (!res.ok) {
      throw new Error(payload?.detail || `Request failed (${res.status})`);
    }
    return payload;
  }, [serverUrl]);

  const fetchData = useCallback(async () => {
    try {
      const [hRes, gRes, cRes, sRes, tRes] = await Promise.all([
        fetchJson("/health"),
        fetchJson("/api/game-state"),
        fetchJson("/api/command-log"),
        fetchJson("/stats").catch(() => null),
        fetchJson("/api/tactical-intel").catch(() => null),
      ]);
      setHealth(hRes);
      setGameState(gRes);
      setCommandLog(cRes.commands || []);
      if (sRes) setStatsData(sRes);
      if (tRes) setTacticalIntel(tRes);
      setConnected(true);
      setHasLoadedOnce(true);
    } catch {
      setConnected(false);
      setHasLoadedOnce(true);
    }
  }, [fetchJson]);

  const queueCommand = useCallback(async (body, { busyKey = "manual" } = {}) => {
    setBusyAction(busyKey);
    try {
      const data = await fetchJson("/api/manual-command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      await fetchData();
      return data;
    } finally {
      setBusyAction("");
    }
  }, [fetchData, fetchJson]);

  const quickActions = [
    { label: "Storm", cmd: { command_type: "set_weather", parameters: "Storm" }, color: "#88bbff" },
    { label: "Fog", cmd: { command_type: "set_weather", parameters: "Foggy" }, color: "#aaaaaa" },
    { label: "Clear", cmd: { command_type: "set_weather", parameters: "Clear" }, color: "#ffcc66" },
    { label: "Night", cmd: { command_type: "set_time", parameters: "22.5" }, color: "#6666aa" },
    { label: "Dawn", cmd: { command_type: "set_time", parameters: "5.75" }, color: "#ff8844" },
    { label: "Cleanup Dead", cmd: { command_type: "cleanup_dead", parameters: "" }, color: "#667766" },
  ];

  const queueQuickAction = useCallback(async (quickAction) => {
    try {
      const data = await queueCommand({
        commands: [{ ...quickAction.cmd, unit_id: "", target_position: "0,0,0", narrative: "", reasoning: "quick_action" }],
        narrative_broadcast: "",
        weather_command: "",
        time_override: -1,
      }, { busyKey: `quick:${quickAction.label}` });
      showActionStatus("success", `${quickAction.label} queued (${data.command_count} command).`);
    } catch (e) {
      showActionStatus("error", `Failed to queue ${quickAction.label.toLowerCase()}: ${e.message}`);
    }
  }, [queueCommand, showActionStatus]);

  const resetMission = useCallback(async () => {
    const confirmed = window.confirm("Reset mission state, command log, tactical memory, and queued commands?");
    if (!confirmed) {
      showActionStatus("info", "Reset cancelled.");
      return;
    }

    setBusyAction("reset");
    try {
      await fetchJson("/api/reset", { method: "POST" });
      await fetchData();
      showActionStatus("success", "Mission state reset.");
    } catch (e) {
      showActionStatus("error", `Reset failed: ${e.message}`);
    } finally {
      setBusyAction("");
    }
  }, [fetchData, fetchJson, showActionStatus]);

  useEffect(() => {
    fetchData();
    const iv = setInterval(fetchData, POLL_INTERVAL);
    return () => clearInterval(iv);
  }, [fetchData]);

  const state = gameState?.state || {};
  const friendlyUnits = state.friendly_units || [];
  const enemyUnits = state.enemy_units || [];
  const players = state.players || [];
  const contacts = state.contacts || [];
  const events = state.recent_events || [];
  const allCommands = commandLog.flatMap((c) => (c.commands?.commands || []).map((cmd) => ({ ...cmd, _ts: c.timestamp, _source: c.source || "llm" })));
  const connectionState = !hasLoadedOnce ? "connecting" : connected ? "connected" : "offline";
  const connectionLabel = connectionState === "connecting" ? "CONNECTING" : connectionState === "connected" ? "CONNECTED" : "OFFLINE";

  const tabStyle = (t) => ({
    padding: "8px 20px",
    fontFamily: "JetBrains Mono",
    fontSize: 11,
    letterSpacing: 1.5,
    textTransform: "uppercase",
    cursor: "pointer",
    background: tab === t ? "rgba(0,255,136,0.08)" : "transparent",
    color: tab === t ? "#00ff88" : "#556655",
    border: "none",
    borderBottom: tab === t ? "2px solid #00ff88" : "2px solid transparent",
    transition: "all 0.15s",
  });

  return (
    <div
      style={{
        minHeight: "100vh",
        background: "#0a0f0a",
        color: "#ccddcc",
        fontFamily: "Rajdhani, sans-serif",
        padding: 0,
      }}
    >
      {/* Header */}
      <div
        style={{
          padding: "16px 24px",
          borderBottom: "1px solid rgba(0,255,136,0.12)",
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          background: "rgba(0,255,136,0.02)",
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <div style={{ fontFamily: "Rajdhani", fontSize: 22, fontWeight: 700, color: "#00ff88", letterSpacing: 2 }}>
            \u25c6 GOD MODE
          </div>
          <div style={{ fontSize: 11, color: "#445544", fontFamily: "JetBrains Mono", letterSpacing: 1 }}>
            COMMAND & CONTROL
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 16, fontSize: 12, fontFamily: "JetBrains Mono" }}>
          <StatusDot state={connectionState} />
          <span style={{ color: connectionState === "connected" ? "#00ff88" : connectionState === "connecting" ? "#ffcc66" : "#ff4444" }}>
            {connectionLabel}
          </span>
          {health && (
            <span style={{ color: "#445544" }}>
              {health.llm_provider?.toUpperCase()} / {health.model}
            </span>
          )}
        </div>
      </div>

      {/* Tabs */}
      <div style={{ display: "flex", borderBottom: "1px solid rgba(0,255,136,0.08)", paddingLeft: 24 }}>
        <button style={tabStyle("overview")} onClick={() => setTab("overview")}>Overview</button>
        <button style={tabStyle("units")} onClick={() => setTab("units")}>Units</button>
        <button style={tabStyle("commands")} onClick={() => setTab("commands")}>Command Log</button>
        <button style={tabStyle("intel")} onClick={() => setTab("intel")}>Intel</button>
        <button style={tabStyle("manual")} onClick={() => setTab("manual")}>Manual Control</button>
      </div>

      <div style={{ padding: "16px 24px 40px", maxWidth: 1600 }}>
        {/* OVERVIEW TAB */}
        {tab === "overview" && (
          <div style={{ display: "flex", gap: 24 }}>
          {/* Left column - stats & info */}
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
              <StatCard label="Players" value={state.player_count ?? "\u2014"} sub={`${players.length} tracked`} />
              <StatCard label="Mission Time" value={fmtTime(state.mission_time_seconds)} />
              <StatCard label="OPFOR Squads" value={enemyUnits.length} sub={`of ${health?.model || "?"}`} accent="#ff8844" />
              <StatCard label="BLUFOR Squads" value={friendlyUnits.length} accent="#4488ff" />
              <StatCard label="Commands Sent" value={health?.total_commands_issued ?? "\u2014"} sub={`${health?.total_requests ?? 0} SITREPs`} />
              <StatCard label="Errors" value={health?.total_errors ?? "\u2014"} accent={health?.total_errors > 0 ? "#ff4444" : "#00ff88"} />
            </div>

            {/* LLM Health + Error Rate Row */}
            <SectionHeader>LLM Health</SectionHeader>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
              <div style={{ flex: 2, minWidth: 280 }}>
                <LLMHealthIndicator statsData={statsData} />
              </div>
              <ErrorRateDisplay health={health} />
            </div>

            {/* Response Time Sparkline */}
            <div style={{ marginTop: 12 }}>
              <ResponseTimeSparkline times={statsData?.recent_response_times_ms} />
            </div>

            <SectionHeader>Environment</SectionHeader>
            <div style={{ display: "flex", gap: 24, fontSize: 13, fontFamily: "JetBrains Mono", flexWrap: "wrap" }}>
              <div>Weather: <span style={{ color: "#00ff88" }}>{state.current_weather || "\u2014"}</span></div>
              <div>Time: <span style={{ color: "#ffcc66" }}>{state.time_of_day != null ? `${Math.floor(state.time_of_day)}:${String(Math.floor((state.time_of_day % 1) * 60)).padStart(2, "0")}` : "\u2014"}</span></div>
              <div>Wind: <span style={{ color: "#88bbff" }}>{fmt(state.wind_speed)} m/s @ {fmt(state.wind_direction)}\u00b0</span></div>
            </div>

            {state.current_objective && (
              <>
                <SectionHeader>Objective</SectionHeader>
                <div style={{ fontSize: 13, fontFamily: "JetBrains Mono", color: "#aacc88" }}>
                  {state.current_objective}
                </div>
              </>
            )}

            {events.length > 0 && (
              <>
                <SectionHeader>Recent Events</SectionHeader>
                <div style={{ maxHeight: 150, overflowY: "auto", fontSize: 12, fontFamily: "JetBrains Mono" }}>
                  {events.map((e, i) => (
                    <div key={i} style={{ color: "#667766", padding: "2px 0", borderBottom: "1px solid rgba(0,255,136,0.04)" }}>
                      <span style={{ color: "#445544", marginRight: 8 }}>\u25b8</span>{e}
                    </div>
                  ))}
                </div>
              </>
            )}

            <SectionHeader>Server Stats</SectionHeader>
            <div style={{ fontSize: 12, fontFamily: "JetBrains Mono", color: "#556655", lineHeight: 1.8 }}>
              <div>Uptime: {health ? fmtTime(health.uptime_seconds) : "\u2014"}</div>
              <div>Active sessions: <span style={{ color: "#00ff88" }}>{health?.active_sessions ?? "\u2014"}</span> {"\u00b7"} Memory messages: <span style={{ color: "#88bbff" }}>{health?.memory_messages ?? "\u2014"}</span></div>
              <div>Input tokens: {health?.total_input_tokens?.toLocaleString() ?? "\u2014"} {"\u00b7"} Output tokens: {health?.total_output_tokens?.toLocaleString() ?? "\u2014"}</div>
              <div>Total tokens: <span style={{ color: "#ccddcc" }}>{health ? ((health.total_input_tokens || 0) + (health.total_output_tokens || 0)).toLocaleString() : "\u2014"}</span></div>
              <div>Avg tokens/request: <span style={{ color: "#ccddcc" }}>{health && health.total_requests > 0 ? Math.round((health.total_input_tokens || 0) / health.total_requests).toLocaleString() : "\u2014"}</span></div>
              <div>Error rate: {health ? fmt(health.total_errors / Math.max(health.total_requests, 1) * 100) : "\u2014"}%</div>
              {health?.glm_endpoint && <div>GLM endpoint: {health.glm_endpoint}</div>}
            </div>

            <SectionHeader>Queue & Reliability</SectionHeader>
            <div style={{ fontSize: 12, fontFamily: "JetBrains Mono", color: "#556655", lineHeight: 1.8 }}>
              <div>
                Circuit breaker:{" "}
                <span style={{ color: statsData?.llm_circuit_status === "open" ? "#ff4444" : statsData?.llm_circuit_status === "half-open" ? "#ffaa44" : "#00ff88", fontWeight: 600 }}>
                  {statsData?.llm_circuit_status?.toUpperCase() ?? "CLOSED"}
                </span>
                {statsData?.llm_consecutive_failures > 0 && (
                  <span style={{ color: "#ff8844", marginLeft: 8 }}>({statsData.llm_consecutive_failures} consecutive failures)</span>
                )}
              </div>
              <div>
                Inflight LLM calls:{" "}
                <span style={{ color: "#88bbff" }}>{statsData?.llm_inflight ?? 0}</span>
                <span style={{ color: "#445544" }}> / {statsData?.llm_max_concurrent ?? "?"}</span>
              </div>
              <div>
                Retries:{" "}
                <span style={{ color: health?.llm_retries > 0 ? "#ffaa44" : "#556655" }}>
                  {health?.llm_retries ?? 0}
                </span>
                {" \u00b7 "}429s:{" "}
                <span style={{ color: health?.llm_429s > 0 ? "#ff6644" : "#556655" }}>
                  {health?.llm_429s ?? 0}
                </span>
                {" \u00b7 "}Coalesced:{" "}
                <span style={{ color: "#88bbff" }}>
                  {health?.llm_coalesced_requests ?? 0}
                </span>
                {" \u00b7 "}Circuit breaks:{" "}
                <span style={{ color: health?.llm_circuit_breaks > 0 ? "#ff4444" : "#556655" }}>
                  {health?.llm_circuit_breaks ?? 0}
                </span>
              </div>
            </div>

          </div>
          {/* Right column - Command Execution Log */}
          <div style={{ width: 480, flexShrink: 0 }}>
            <SectionHeader>Command Execution Log</SectionHeader>
            <CommandExecutionLog commandLog={commandLog} />
          </div>
          </div>
        )}

        {/* UNITS TAB */}
        {tab === "units" && (
          <>
            <SectionHeader>OPFOR Units ({enemyUnits.length})</SectionHeader>
            {enemyUnits.length === 0 ? (
              <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No OPFOR units tracked</div>
            ) : (
              enemyUnits.map((u, i) => <UnitRow key={i} unit={u} />)
            )}

            <SectionHeader>BLUFOR Units ({friendlyUnits.length})</SectionHeader>
            {friendlyUnits.length === 0 ? (
              <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No BLUFOR units tracked</div>
            ) : (
              friendlyUnits.map((u, i) => <UnitRow key={i} unit={u} />)
            )}

            <SectionHeader>Players ({players.length})</SectionHeader>
            {players.length === 0 ? (
              <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No players connected</div>
            ) : (
              players.map((p, i) => (
                <div key={i} style={{ display: "flex", gap: 16, fontSize: 12, fontFamily: "JetBrains Mono", padding: "4px 0", borderBottom: "1px solid rgba(0,255,136,0.06)" }}>
                  <span style={{ color: "#4488ff" }}>Player {p.player_id}</span>
                  <span style={{ color: "#667766" }}>HP: {((p.health_pct || 0) * 100).toFixed(0)}%</span>
                  <span style={{ color: "#556655" }}>{p.is_in_vehicle ? `In ${p.vehicle_type || "vehicle"}` : "On foot"}</span>
                </div>
              ))
            )}

            <SectionHeader>Contacts ({contacts.length})</SectionHeader>
            {contacts.length === 0 ? (
              <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No contacts detected</div>
            ) : (
              contacts.map((c, i) => {
                const conf = (c.confidence || 0) * 100;
                const confColor = conf > 70 ? "#00ff88" : conf > 40 ? "#ffaa00" : "#ff4444";
                const pos = Array.isArray(c.last_known_position) ? c.last_known_position.join(", ") : "\u2014";
                return (
                  <div
                    key={i}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: 12,
                      padding: "6px 0",
                      borderBottom: "1px solid rgba(0,255,136,0.06)",
                      fontSize: 12,
                      fontFamily: "JetBrains Mono",
                    }}
                  >
                    <span style={{ color: "#00ff88", width: 90, flexShrink: 0 }}>{c.contact_id}</span>
                    <span style={{ color: "#889988", width: 110, flexShrink: 0 }}>{c.unit_type}</span>
                    <span style={{ color: confColor, width: 60, flexShrink: 0 }}>{conf.toFixed(0)}%</span>
                    <span style={{ color: "#667766", flex: 1 }}>{pos}</span>
                    <span style={{ color: "#556655", flexShrink: 0 }}>{c.seconds_since_seen != null ? `${c.seconds_since_seen}s ago` : "\u2014"}</span>
                  </div>
                );
              })
            )}
          </>
        )}

        {/* COMMAND LOG TAB */}
        {tab === "commands" && (
          <>
            <SectionHeader>Command History ({allCommands.length} commands{(() => { const m = allCommands.filter(c => c._source === "manual").length; return m > 0 ? `, ${m} manual` : ""; })()}, {commandLog.length} batches)</SectionHeader>
            <div ref={logRef} style={{ maxHeight: 500, overflowY: "auto" }}>
              {commandLog.length === 0 ? (
                <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No commands issued yet</div>
              ) : (
                [...commandLog].reverse().map((batch, batchIdx) => {

              tacticEntries.forEach(([name, d]) => {
                const rate = d.issued > 0 ? d.successful / d.issued : 0;
                if (rate > bestRate) { bestRate = rate; bestTactic = name; }
                if (rate < worstRate) { worstRate = rate; worstTactic = name; }

            {/* Counter-Ambush Warnings Panel */}
            <SectionHeader>Counter-Ambush Warnings</SectionHeader>
            {(() => {
              const spatial = tacticalIntel?.spatial || {};
              const ambushWarnings = spatial.ambush_warnings || [];

              if (ambushWarnings.length === 0) {
                return <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No active ambush threats detected</div>;
              }

              // Detect coordinated ambushes: multiple stationary players within 200m of each other
              const coordinated = [];
              for (let i = 0; i < ambushWarnings.length; i++) {
                for (let j = i + 1; j < ambushWarnings.length; j++) {
                  const a = ambushWarnings[i];
                  const b = ambushWarnings[j];
                  const posA = a.position || [0,0,0];
                  const posB = b.position || [0,0,0];
                  const dx = posA[0] - posB[0];
                  const dz = (posA[2] || 0) - (posB[2] || 0);
                  const dist = Math.sqrt(dx*dx + dz*dz);
                  if (dist < 200) {
                    coordinated.push({ players: [a.player_id, b.player_id], distance: Math.round(dist) });
                  }
                }
              }

              return (
                <div style={{ fontSize: 12, fontFamily: "JetBrains Mono" }}>
                  {/* Coordinated ambush alert */}
                  {coordinated.length > 0 && (

                    const engColor = engagements > 5 ? "#ff4444" : engagements > 2 ? "#ff8844" : "#ffaa00";

                    // Compute kill zone info from position and nearby engagement data

                        </div>

            {/* Player Profile Trends */}

              // Map styles to trend indicators and predicted actions
              const trendMap = {
                aggressive_assault: { trend: "\u2191", trendLabel: "escalating", predicted: "Push forward with heavy fire", trendColor: "#ff4444" },
                aggressive_push: { trend: "\u2191", trendLabel: "escalating", predicted: "Sustained offensive pressure", trendColor: "#ff4444" },

                        const cas = u.casualties || 0;
                        const ratio = cas > 0 ? (kills / cas) : kills > 0 ? "\u221e" : "\u2014";
                        const ratioColor = typeof ratio === "number" ? (ratio >= 1 ? "#00ff88" : "#ff4444") : ratio === "\u221e" ? "#00ff88" : "#556655";
                        return (
                          <tr key={i} style={{ borderBottom: "1px solid rgba(0,255,136,0.06)" }}>
                            <td style={{ padding: "5px 8px", color: "#00ff88" }}>{u.unit_id}</td>
                            <td style={{ padding: "5px 8px", color: "#889988" }}>{u.unit_type}</td>
                            <td style={{ padding: "5px 8px", textAlign: "right", color: "#ff4444" }}>{kills}</td>
                            <td style={{ padding: "5px 8px", textAlign: "right", color: "#ffaa00" }}>{cas}</td>
                            <td style={{ padding: "5px 8px", textAlign: "right", color: ratioColor }}>
                              {typeof ratio === "number" ? ratio.toFixed(1) : ratio}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              );
            })()}

            {/* Terrain Overview */}
            <SectionHeader>Terrain Overview</SectionHeader>
            {(() => {
              const terrain = tacticalIntel?.terrain_summary || {};
              const entries = Object.entries(terrain);
              if (entries.length === 0) {
                return <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No terrain data available</div>;
              }
              return (
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  {entries.map(([type, data]) => {
                    const coverPct = ((data.avg_cover || 0) * 100).toFixed(0);
                    const coverColor = data.avg_cover > 0.6 ? "#00ff88" : data.avg_cover > 0.3 ? "#ffaa00" : "#ff8844";
                    return (
                      <div key={type} style={{
                        background: "rgba(0,255,136,0.03)", border: "1px solid rgba(0,255,136,0.12)",
                        padding: "10px 16px", minWidth: 130,
                      }}>
                        <div style={{ fontSize: 11, color: "#667766", letterSpacing: 1.5, fontFamily: "JetBrains Mono", textTransform: "uppercase" }}>
                          {type}
                        </div>
                        <div style={{ fontSize: 22, fontWeight: 700, color: coverColor, fontFamily: "Rajdhani", marginTop: 2 }}>
                          {coverPct}%
                        </div>
                        <div style={{ fontSize: 10, color: "#556655", fontFamily: "JetBrains Mono", marginTop: 2 }}>
                          cover \u00b7 {data.count || 0} sample{(data.count || 0) !== 1 ? "s" : ""}
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })()}
          </>
        )}

        {/* MANUAL CONTROL TAB */}
        {tab === "manual" && (
          <>
            <SectionHeader>Manual Command Injection</SectionHeader>
            <div style={{ fontSize: 12, color: "#556655", fontFamily: "JetBrains Mono", marginBottom: 14 }}>
              Send commands directly to the game, bypassing the LLM. Commands are merged into the next SITREP response.
            </div>
            <ManualCommandPanel queueCommand={queueCommand} busy={busyAction === "manual"} />

            <SectionHeader>Quick Actions</SectionHeader>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {quickActions.map((q) => (
                <button
                  key={q.label}
                  disabled={!!busyAction}
                  onClick={() => queueQuickAction(q)}
                  style={{
                    background: "transparent",
                    border: `1px solid ${q.color}44`,
                    color: q.color,
                    padding: "6px 16px",
                    fontFamily: "JetBrains Mono",
                    fontSize: 11,
                    cursor: busyAction ? "wait" : "pointer",
                    letterSpacing: 0.5,
                    opacity: busyAction ? 0.55 : 1,
                  }}
                >
                  {busyAction === `quick:${q.label}` ? `… ${q.label}` : q.label}
                </button>
              ))}
            </div>
            <ActionStatus status={actionStatus} />

            <SectionHeader>Mission Control</SectionHeader>
            <div style={{ display: "flex", gap: 8 }}>
              <button
                disabled={!!busyAction}
                onClick={resetMission}
                style={{
                  background: "rgba(255,68,68,0.08)",
                  border: "1px solid rgba(255,68,68,0.25)",
                  color: "#ff4444",
                  padding: "8px 20px",
                  fontFamily: "JetBrains Mono",
                  fontSize: 11,
                  cursor: busyAction ? "wait" : "pointer",
                  letterSpacing: 1,
                  textTransform: "uppercase",
                  opacity: busyAction ? 0.6 : 1,
                }}
              >
                {busyAction === "reset" ? "… Resetting" : "\u27f3 Reset Mission"}
              </button>
            </div>
          </>
        )}
      </div>

      {/* Footer */}
      <div
        style={{
          position: "fixed",
          bottom: 0,
          left: 0,
          right: 0,
          padding: "6px 24px",
          background: "#0a0f0a",
          borderTop: "1px solid rgba(0,255,136,0.08)",
          display: "flex",
          justifyContent: "space-between",
          fontSize: 10,
          fontFamily: "JetBrains Mono",
          color: "#334433",
        }}
      >
        <span>SITREP age: {gameState?.age_seconds != null ? `${fmt(gameState.age_seconds)}s` : "\u2014"}</span>
        <span>Polling every {POLL_INTERVAL / 1000}s</span>
        <span>{new Date().toLocaleTimeString()}</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard />);
</script>
</body>
</html>
