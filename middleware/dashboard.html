<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>God Mode · Arma Reforger</title>
  <style nonce="GODMODE_CSP_NONCE">
    :root {
      color-scheme: dark; --bg: #101512; --panel: #19211c; --line: #365044;
      --ink: #edf5ef; --muted: #aec5b5; --accent: #91edb3; --error: #ffbda9;
      font: 16px/1.5 system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    .wrap { width: min(72rem, 100% - 2rem); margin: 0 auto; }
    header { padding: 2.2rem 0 1.5rem; border-bottom: 1px solid var(--line); }
    .eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: .12em; font-size: .8rem; font-weight: 700; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(1.85rem, 6vw, 3rem); line-height: 1.2; margin: .3rem 0; }
    h2 { font-size: 1.35rem; }
    h3 { font-size: 1rem; }
    p { color: var(--muted); }
    main { padding: 1.5rem 0 3rem; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: .7rem; padding: 1rem; margin-bottom: 1rem; }
    #unlock-panel { max-width: 34rem; }
    .stack { display: grid; gap: .7rem; }
    .bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .6rem 1rem; margin-bottom: 1rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .55rem; }
    .status { min-height: 1.5rem; margin-bottom: .65rem; }
    .status[data-error="true"] { color: var(--error); }
    input, select, button, textarea { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: .35rem; background: var(--bg); padding: .5rem .7rem; }
    input, textarea { width: 100%; }
    select { max-width: 100%; }
    button { cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .primary { background: var(--accent); color: #102119; border-color: var(--accent); font-weight: 700; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: .65rem; margin-bottom: 1rem; }
    .cards div { border: 1px solid var(--line); border-radius: .45rem; padding: .7rem; overflow-wrap: anywhere; }
    dt { color: var(--muted); font-size: .85rem; }
    dd { margin: .2rem 0 0; font-size: 1.1rem; }
    pre, textarea { font-family: ui-monospace, monospace; font-size: .88rem; }
    pre { margin: 0; padding: .8rem; background: var(--bg); border-radius: .3rem; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 30rem; overflow: auto; }
    textarea { resize: vertical; min-height: 7rem; }
    summary { cursor: pointer; font-weight: 700; }
    details[open] summary { margin-bottom: .7rem; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="eyebrow">Arma Reforger</div>
      <h1>God Mode</h1>
      <p>Middleware operation and game telemetry</p>
    </div>
  </header>
  <main class="wrap">
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <section id="unlock-panel" class="panel stack">
      <h2>Unlock dashboard</h2>
      <p>Use the admin API key. It is kept only in this tab’s memory until you lock or reload the page.</p>
      <form id="unlock-form" class="stack" autocomplete="off">
        <label for="admin-key">Admin API key</label>
        <input id="admin-key" type="password" required minlength="32" maxlength="128" autocomplete="off" spellcheck="false" autocapitalize="off">
        <div><button id="unlock" type="submit" class="primary">Unlock</button></div>
      </form>
      <noscript><p>JavaScript is required to unlock and operate the dashboard.</p></noscript>
    </section>

    <div id="console" hidden>
      <div class="bar">
        <h2>Overview</h2>
        <div class="actions">
          <button id="refresh" type="button">Refresh</button>
          <button id="lock" type="button">Lock</button>
        </div>
      </div>
      <dl class="cards">
        <div><dt>LLM provider</dt><dd id="provider">—</dd></div>
        <div><dt>Model</dt><dd id="model">—</dd></div>
        <div><dt>SITREPs</dt><dd id="sitreps">—</dd></div>
        <div><dt>Players</dt><dd id="players">—</dd></div>
      </dl>
      <section class="panel">
        <div class="bar">
          <h3><label for="view">Inspect</label></h3>
          <select id="view">
            <option value="game">Latest game state</option>
            <option value="commands">Game command log</option>
            <option value="tactical">Tactical telemetry</option>
            <option value="plan">Battle plan</option>
            <option value="campaign">Campaign</option>
            <option value="health">Middleware health</option>
            <option value="stats">Middleware statistics</option>
            <option value="metrics">Middleware metrics</option>
            <option value="server">Game server status</option>
            <option value="serverMetrics">Host metrics</option>
            <option value="rcon">RCON status</option>
            <option value="behavior">Behavior settings</option>
            <option value="logs">Game server logs (when enabled)</option>
            <option value="agents">Agents</option>
            <option value="replays">Replay files</option>
            <option value="reports">Battle reports</option>
          </select>
        </div>
        <pre id="detail" tabindex="0">No data yet.</pre>
      </section>
      <details id="operator" class="panel">
        <summary>Operator controls</summary>
        <form id="command-form" class="stack">
          <label for="batch">Manual game command batch (JSON)</label>
          <textarea id="batch" maxlength="65536" required spellcheck="false" placeholder='{"commands": []}'></textarea>
          <div class="actions">
            <button id="queue" type="submit" class="primary">Queue batch</button>
            <button id="reset" type="button">Reset session data</button>
          </div>
        </form>
        <p id="operator-status" class="status" role="status"></p>
      </details>
    </div>
  </main>
  <script nonce="GODMODE_CSP_NONCE">
    "use strict";
    (() => {
      const byId = id => document.getElementById(id);
      const routes = Object.freeze({
        game: "/api/game-state", commands: "/api/command-log", tactical: "/api/tactical-intel",
        plan: "/api/battle-plan", campaign: "/api/campaign", health: "/api/health",
        stats: "/stats", metrics: "/api/metrics", server: "/api/server/status",
        serverMetrics: "/api/server/metrics", rcon: "/api/rcon/status",
        behavior: "/api/behavior-config", logs: "/api/server/log?lines=100",
        agents: "/api/agents", replays: "/api/replays", reports: "/api/battle-summaries",
      });
      const readPaths = new Set(Object.values(routes));
      const writePaths = new Set(["/api/manual-command", "/api/reset"]);
      const origin = window.location.origin;
      let session;
      let timer;
      let unlocked = false;
      let refreshId = 0;

      function showStatus(message, error = false, target = "status") {
        const element = byId(target);
        element.textContent = message;
        element.dataset.error = String(error);
      }

      function lock(message, error = false) {
        if (session) {
          session.abort.abort();
          session.key = "";
        }
        session = undefined;
        unlocked = false;
        clearInterval(timer);
        byId("unlock-panel").hidden = false;
        byId("console").hidden = true;
        byId("operator").open = false;
        byId("admin-key").value = "";
        byId("batch").value = "";
        byId("unlock").disabled = false;
        byId("queue").disabled = false;
        byId("reset").disabled = false;
        byId("detail").textContent = "No data yet.";
        for (const id of ["provider", "model", "sitreps", "players"]) byId(id).textContent = "—";
        showStatus("", false, "operator-status");
        showStatus(message, error);
      }

      async function request(active, path, method = "GET", body) {
        const allowed = method === "GET" ? readPaths : method === "POST" ? writePaths : null;
        if (active !== session || !allowed?.has(path)) throw new Error("Request not permitted");
        const url = new URL(path, origin);
        if (url.origin !== origin || url.username || url.password) throw new Error("Invalid API destination");
        const headers = { "X-API-Key": active.key, "Accept": "application/json" };
        if (body !== undefined) headers["Content-Type"] = "application/json";
        const response = await fetch(url, {
          method, headers, body, mode: "same-origin", redirect: "error", cache: "no-store",
          credentials: "omit", referrerPolicy: "no-referrer", signal: active.abort.signal,
        });
        if (response.status === 401 && active === session) {
          lock("The admin key was rejected. Enter a valid admin key to continue.", true);
          throw new Error("Admin key rejected");
        }
        if (!response.ok) throw new Error("Request returned HTTP " + response.status + ".");
        return response.json();
      }

      async function refresh() {
        const active = session;
        if (!unlocked || !active) return;
        const id = ++refreshId;
        const view = byId("view").value;
        const path = Object.hasOwn(routes, view) ? routes[view] : routes.game;
        const health = request(active, routes.health);
        const game = request(active, routes.game);
        const detail = path === routes.game ? game : path === routes.health ? health : request(active, path);
        const [healthResult, gameResult, detailResult] = await Promise.allSettled([health, game, detail]);
        if (active !== session || id !== refreshId) return;
        byId("provider").textContent = healthResult.value?.llm_provider ?? "Unavailable";
        byId("model").textContent = healthResult.value?.model ?? "—";
        byId("sitreps").textContent = healthResult.value?.total_requests ?? "—";
        byId("players").textContent = gameResult.value?.state?.player_count ?? "—";
        byId("detail").textContent = detailResult.status === "fulfilled"
          ? JSON.stringify(detailResult.value, null, 2)
          : detailResult.reason.message;
        if (healthResult.status === "fulfilled") {
          showStatus("Last refresh " + new Date().toLocaleTimeString());
        } else {
          showStatus("Unable to refresh middleware health.", true);
        }
      }

      byId("unlock-form").addEventListener("submit", async event => {
        event.preventDefault();
        if (session) return;
        const input = byId("admin-key");
        const key = input.value;
        input.value = "";
        if (!/^[A-Za-z0-9_-]{32,128}$/.test(key)) {
          showStatus("Enter the 32–128 character admin API key.", true);
          return;
        }
        const active = { key, abort: new AbortController() };
        session = active;
        byId("unlock").disabled = true;
        showStatus("Checking admin key…");
        try {
          await request(active, routes.health);
          if (session !== active) return;
          unlocked = true;
          byId("unlock-panel").hidden = true;
          byId("console").hidden = false;
          byId("refresh").focus();
          timer = setInterval(refresh, 10000);
          await refresh();
        } catch {
          if (active === session) lock("Could not unlock the dashboard. Check the middleware connection.", true);
        }
      });

      byId("command-form").addEventListener("submit", async event => {
        event.preventDefault();
        const active = session;
        if (!active || !unlocked) return;
        let batch;
        try {
          batch = JSON.parse(byId("batch").value);
          if (!batch || !Array.isArray(batch.commands)) throw new Error();
        } catch {
          showStatus('Enter a JSON object with a "commands" array.', true, "operator-status");
          return;
        }
        byId("queue").disabled = true;
        try {
          const result = await request(active, "/api/manual-command", "POST", JSON.stringify(batch));
          if (active !== session) return;
          showStatus("Queued commands: " + result.command_count, false, "operator-status");
          await refresh();
        } catch (error) {
          if (active === session) showStatus(error.message, true, "operator-status");
        } finally {
          if (active === session) byId("queue").disabled = false;
        }
      });

      byId("reset").addEventListener("click", async () => {
        const active = session;
        if (!active || !unlocked || !window.confirm("Reset current session data and the command log?")) return;
        byId("reset").disabled = true;
        try {
          await request(active, "/api/reset", "POST");
          if (active !== session) return;
          showStatus("Session data reset.", false, "operator-status");
          await refresh();
        } catch (error) {
          if (active === session) showStatus(error.message, true, "operator-status");
        } finally {
          if (active === session) byId("reset").disabled = false;
        }
      });
      byId("view").addEventListener("change", refresh);
      byId("refresh").addEventListener("click", refresh);
      byId("lock").addEventListener("click", () => {
        lock("Dashboard locked.");
        byId("admin-key").focus();
      });
      window.addEventListener("pagehide", () => lock(""));
    })();
  </script>
</body>
</html>
