        </>
      )}

      {/* DIAGNOSTICS sub-tab */}
      {subTab === "diagnostics" && (
        <QuickDiagnostics fetchJson={fetchJson} serverStatus={serverStatus} />
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════
// MAIN DASHBOARD
// ═══════════════════════════════════════════════

function Dashboard() {
  const [health, setHealth] = useState(null);
  const [gameState, setGameState] = useState(null);
  const [commandLog, setCommandLog] = useState([]);
  const [statsData, setStatsData] = useState(null);
  const [tacticalIntel, setTacticalIntel] = useState(null);
  const [connected, setConnected] = useState(false);
  const [hasLoadedOnce, setHasLoadedOnce] = useState(false);
  const [tab, setTab] = useState("overview");
  const [actionStatus, setActionStatus] = useState(null);
  const [busyAction, setBusyAction] = useState("");
  const [serverStatus, setServerStatus] = useState(null);
  const [serverError, setServerError] = useState(null);
  const [serverMetrics, setServerMetrics] = useState(null);
  const serverUrl = API_BASE;
  const logRef = useRef(null);
  const actionStatusTimerRef = useRef(null);
  const serverPollRef = useRef(null);

  const showActionStatus = useCallback((type, message) => {
    if (actionStatusTimerRef.current) clearTimeout(actionStatusTimerRef.current);
    setActionStatus({ type, message });
    actionStatusTimerRef.current = setTimeout(() => setActionStatus(null), STATUS_TIMEOUT);
  }, []);

  useEffect(() => {
    return () => {
      if (actionStatusTimerRef.current) clearTimeout(actionStatusTimerRef.current);
    };
  }, []);

  const fetchJson = useCallback(async (path, options) => {
    const res = await fetch(`${serverUrl}${path}`, options);
    const contentType = res.headers.get("content-type") || "";
    const payload = contentType.includes("application/json") ? await res.json() : { detail: await res.text() };
    if (!res.ok) {
      throw new Error(payload?.detail || `Request failed (${res.status})`);
    }
    return payload;
  }, [serverUrl]);

  const fetchData = useCallback(async () => {
    try {
      const [hRes, gRes, cRes, sRes, tRes] = await Promise.all([
        fetchJson("/health"),
        fetchJson("/api/game-state"),
        fetchJson("/api/command-log"),
        fetchJson("/stats").catch(() => null),
        fetchJson("/api/tactical-intel").catch(() => null),
      ]);
      setHealth(hRes);
      setGameState(gRes);
      setCommandLog(cRes.commands || []);
      if (sRes) setStatsData(sRes);
      if (tRes) setTacticalIntel(tRes);
      setConnected(true);
      setHasLoadedOnce(true);
    } catch {
      setConnected(false);
      setHasLoadedOnce(true);
    }
  }, [fetchJson]);

  const queueCommand = useCallback(async (body, { busyKey = "manual" } = {}) => {
    setBusyAction(busyKey);
    try {
      const data = await fetchJson("/api/manual-command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      await fetchData();
      return data;
    } finally {
      setBusyAction("");
    }
  }, [fetchData, fetchJson]);

  const quickActions = [
    { label: "Storm", cmd: { command_type: "set_weather", parameters: "Storm" }, color: "#88bbff" },
    { label: "Fog", cmd: { command_type: "set_weather", parameters: "Foggy" }, color: "#aaaaaa" },
    { label: "Clear", cmd: { command_type: "set_weather", parameters: "Clear" }, color: "#ffcc66" },
    { label: "Night", cmd: { command_type: "set_time", parameters: "22.5" }, color: "#6666aa" },
    { label: "Dawn", cmd: { command_type: "set_time", parameters: "5.75" }, color: "#ff8844" },
    { label: "Cleanup Dead", cmd: { command_type: "cleanup_dead", parameters: "" }, color: "#667766" },
  ];

  const queueQuickAction = useCallback(async (quickAction) => {
    try {
      const data = await queueCommand({
        commands: [{ ...quickAction.cmd, unit_id: "", target_position: "0,0,0", narrative: "", reasoning: "quick_action" }],
        narrative_broadcast: "",
        weather_command: "",
        time_override: -1,
      }, { busyKey: `quick:${quickAction.label}` });
      showActionStatus("success", `${quickAction.label} queued (${data.command_count} command).`);
    } catch (e) {
      showActionStatus("error", `Failed to queue ${quickAction.label.toLowerCase()}: ${e.message}`);
    }
  }, [queueCommand, showActionStatus]);

  const resetMission = useCallback(async () => {
    const confirmed = window.confirm("Reset mission state, command log, tactical memory, and queued commands?");
    if (!confirmed) {
      showActionStatus("info", "Reset cancelled.");
      return;
    }

    setBusyAction("reset");
    try {
      await fetchJson("/api/reset", { method: "POST" });
      await fetchData();
      showActionStatus("success", "Mission state reset.");
    } catch (e) {
      showActionStatus("error", `Reset failed: ${e.message}`);
    } finally {
      setBusyAction("");
    }
  }, [fetchData, fetchJson, showActionStatus]);

  useEffect(() => {
    fetchData();
    const iv = setInterval(fetchData, POLL_INTERVAL);
    return () => clearInterval(iv);
  }, [fetchData]);

  // Server tab polling: only poll when server tab is active
  const fetchServerStatus = useCallback(async () => {
    try {
      const [statusData, metricsData] = await Promise.all([
        fetchJson("/api/server/status"),
        fetchJson("/api/server/metrics").catch(() => null),
      ]);
      setServerStatus(statusData);
      if (metricsData) setServerMetrics(metricsData);
      setServerError(null);
    } catch (e) {
      setServerError(e.message);
    }
  }, [fetchJson]);

  useEffect(() => {
    if (tab !== "server") return;
    fetchServerStatus();
    serverPollRef.current = setInterval(fetchServerStatus, POLL_INTERVAL);
    return () => clearInterval(serverPollRef.current);
  }, [tab, fetchServerStatus]);

  const handleServerAction = useCallback(async (action) => {
    const busyKey = `server:${action}`;
    setBusyAction(busyKey);
    try {
      await fetchJson(`/api/server/${action}`, { method: "POST" });
      showActionStatus("success", `Server ${action} command sent.`);
      await fetchServerStatus();
    } catch (e) {
      showActionStatus("error", `Server ${action} failed: ${e.message}`);
    } finally {
      setBusyAction("");
    }
  }, [fetchJson, fetchServerStatus, showActionStatus]);

  const handleKickPlayer = useCallback(async (playerId) => {
    try {
      await fetchJson("/api/server/rcon", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command: `kick ${playerId}` }),
      });
      showActionStatus("success", `Kick command sent for player ${playerId}.`);
      await fetchServerStatus();
    } catch (e) {
      showActionStatus("error", `Kick failed: ${e.message}`);
    }
  }, [fetchJson, fetchServerStatus, showActionStatus]);

  const state = gameState?.state || {};
  const friendlyUnits = state.friendly_units || [];
  const enemyUnits = state.enemy_units || [];
  const players = state.players || [];
  const contacts = state.contacts || [];
  const events = state.recent_events || [];
  const allCommands = commandLog.flatMap((c) => (c.commands?.commands || []).map((cmd) => ({ ...cmd, _ts: c.timestamp, _source: c.source || "llm" })));
  const connectionState = !hasLoadedOnce ? "connecting" : connected ? "connected" : "offline";
  const connectionLabel = connectionState === "connecting" ? "CONNECTING" : connectionState === "connected" ? "CONNECTED" : "OFFLINE";

  const tabStyle = (t) => ({
    padding: "8px 20px",
    fontFamily: "JetBrains Mono",
    fontSize: 11,
    letterSpacing: 1.5,
    textTransform: "uppercase",
    cursor: "pointer",
    background: tab === t ? "rgba(0,255,136,0.08)" : "transparent",
    color: tab === t ? "#00ff88" : "#556655",
    border: "none",
    borderBottom: tab === t ? "2px solid #00ff88" : "2px solid transparent",
    transition: "all 0.15s",
  });

  return (
    <div
      style={{
        minHeight: "100vh",
        background: "#0a0f0a",
        color: "#ccddcc",
        fontFamily: "Rajdhani, sans-serif",
        padding: 0,
      }}
    >
      {/* Header */}
      <div
        style={{
          padding: "16px 24px",
          borderBottom: "1px solid rgba(0,255,136,0.12)",
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          background: "rgba(0,255,136,0.02)",
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <div style={{ fontFamily: "Rajdhani", fontSize: 22, fontWeight: 700, color: "#00ff88", letterSpacing: 2 }}>
            \u25c6 GOD MODE
          </div>
          <div style={{ fontSize: 11, color: "#445544", fontFamily: "JetBrains Mono", letterSpacing: 1 }}>
            COMMAND & CONTROL
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 16, fontSize: 12, fontFamily: "JetBrains Mono" }}>
          <StatusDot state={connectionState} />
          <span style={{ color: connectionState === "connected" ? "#00ff88" : connectionState === "connecting" ? "#ffcc66" : "#ff4444" }}>
            {connectionLabel}
          </span>
          {health && (
            <span style={{ color: "#445544" }}>
              {health.llm_provider?.toUpperCase()} / {health.model}
            </span>
          )}
        </div>
      </div>

      {/* Tabs */}
      <div style={{ display: "flex", borderBottom: "1px solid rgba(0,255,136,0.08)", paddingLeft: 24 }}>
        <button style={tabStyle("overview")} onClick={() => setTab("overview")}>Overview</button>
        <button style={tabStyle("units")} onClick={() => setTab("units")}>Units</button>
        <button style={tabStyle("commands")} onClick={() => setTab("commands")}>Command Log</button>
        <button style={tabStyle("intel")} onClick={() => setTab("intel")}>Intel</button>
        <button style={tabStyle("manual")} onClick={() => setTab("manual")}>Manual Control</button>
        <button style={tabStyle("server")} onClick={() => setTab("server")}>Server</button>
      </div>

      <div style={{ padding: "16px 24px 40px", maxWidth: 1600 }}>
        {/* OVERVIEW TAB */}
        {tab === "overview" && (
          <div style={{ display: "flex", gap: 24 }}>
          {/* Left column - stats & info */}
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
              <StatCard label="Players" value={state.player_count ?? "\u2014"} sub={`${players.length} tracked`} />
              <StatCard label="Mission Time" value={fmtTime(state.mission_time_seconds)} />
              <StatCard label="OPFOR Squads" value={enemyUnits.length} sub={`of ${health?.model || "?"}`} accent="#ff8844" />
              <StatCard label="BLUFOR Squads" value={friendlyUnits.length} accent="#4488ff" />
              <StatCard label="Commands Sent" value={health?.total_commands_issued ?? "\u2014"} sub={`${health?.total_requests ?? 0} SITREPs`} />
              <StatCard label="Errors" value={health?.total_errors ?? "\u2014"} accent={health?.total_errors > 0 ? "#ff4444" : "#00ff88"} />
            </div>

            {/* LLM Health + Error Rate Row */}
            <SectionHeader>LLM Health</SectionHeader>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
              <div style={{ flex: 2, minWidth: 280 }}>
                <LLMHealthIndicator statsData={statsData} />
              </div>
              <ErrorRateDisplay health={health} />
            </div>

            {/* Response Time Sparkline */}
            <div style={{ marginTop: 12 }}>
              <ResponseTimeSparkline times={statsData?.recent_response_times_ms} />
            </div>

            <SectionHeader>Environment</SectionHeader>
            <div style={{ display: "flex", gap: 24, fontSize: 13, fontFamily: "JetBrains Mono", flexWrap: "wrap" }}>
              <div>Weather: <span style={{ color: "#00ff88" }}>{state.current_weather || "\u2014"}</span></div>
              <div>Time: <span style={{ color: "#ffcc66" }}>{state.time_of_day != null ? `${Math.floor(state.time_of_day)}:${String(Math.floor((state.time_of_day % 1) * 60)).padStart(2, "0")}` : "\u2014"}</span></div>
              <div>Wind: <span style={{ color: "#88bbff" }}>{fmt(state.wind_speed)} m/s @ {fmt(state.wind_direction)}\u00b0</span></div>
            </div>

            {state.current_objective && (
              <>
                <SectionHeader>Objective</SectionHeader>
                <div style={{ fontSize: 13, fontFamily: "JetBrains Mono", color: "#aacc88" }}>
                  {state.current_objective}
                </div>
              </>
            )}

            {events.length > 0 && (
              <>
                <SectionHeader>Recent Events</SectionHeader>
                <div style={{ maxHeight: 150, overflowY: "auto", fontSize: 12, fontFamily: "JetBrains Mono" }}>
                  {events.map((e, i) => (
                    <div key={i} style={{ color: "#667766", padding: "2px 0", borderBottom: "1px solid rgba(0,255,136,0.04)" }}>
                      <span style={{ color: "#445544", marginRight: 8 }}>\u25b8</span>{e}
                    </div>
                  ))}
                </div>
              </>
            )}

            <SectionHeader>Server Stats</SectionHeader>
            <div style={{ fontSize: 12, fontFamily: "JetBrains Mono", color: "#556655", lineHeight: 1.8 }}>
              <div>Uptime: {health ? fmtTime(health.uptime_seconds) : "\u2014"}</div>
              <div>Active sessions: <span style={{ color: "#00ff88" }}>{health?.active_sessions ?? "\u2014"}</span> {"\u00b7"} Memory messages: <span style={{ color: "#88bbff" }}>{health?.memory_messages ?? "\u2014"}</span></div>
              <div>Input tokens: {health?.total_input_tokens?.toLocaleString() ?? "\u2014"} {"\u00b7"} Output tokens: {health?.total_output_tokens?.toLocaleString() ?? "\u2014"}</div>
              <div>Total tokens: <span style={{ color: "#ccddcc" }}>{health ? ((health.total_input_tokens || 0) + (health.total_output_tokens || 0)).toLocaleString() : "\u2014"}</span></div>
              <div>Avg tokens/request: <span style={{ color: "#ccddcc" }}>{health && health.total_requests > 0 ? Math.round((health.total_input_tokens || 0) / health.total_requests).toLocaleString() : "\u2014"}</span></div>
              <div>Error rate: {health ? fmt(health.total_errors / Math.max(health.total_requests, 1) * 100) : "\u2014"}%</div>
              {health?.glm_endpoint && <div>GLM endpoint: {health.glm_endpoint}</div>}
            </div>

            <SectionHeader>Queue & Reliability</SectionHeader>
            <div style={{ fontSize: 12, fontFamily: "JetBrains Mono", color: "#556655", lineHeight: 1.8 }}>
              <div>
                Circuit breaker:{" "}
                <span style={{ color: statsData?.llm_circuit_status === "open" ? "#ff4444" : statsData?.llm_circuit_status === "half-open" ? "#ffaa44" : "#00ff88", fontWeight: 600 }}>
                  {statsData?.llm_circuit_status?.toUpperCase() ?? "CLOSED"}
                </span>
                {statsData?.llm_consecutive_failures > 0 && (
                  <span style={{ color: "#ff8844", marginLeft: 8 }}>({statsData.llm_consecutive_failures} consecutive failures)</span>
                )}
              </div>
              <div>
                Inflight LLM calls:{" "}
                <span style={{ color: "#88bbff" }}>{statsData?.llm_inflight ?? 0}</span>
                <span style={{ color: "#445544" }}> / {statsData?.llm_max_concurrent ?? "?"}</span>
              </div>
              <div>
                Retries:{" "}
                <span style={{ color: health?.llm_retries > 0 ? "#ffaa44" : "#556655" }}>
                  {health?.llm_retries ?? 0}
                </span>
                {" \u00b7 "}429s:{" "}
                <span style={{ color: health?.llm_429s > 0 ? "#ff6644" : "#556655" }}>
                  {health?.llm_429s ?? 0}
                </span>
                {" \u00b7 "}Coalesced:{" "}
                <span style={{ color: "#88bbff" }}>
                  {health?.llm_coalesced_requests ?? 0}
                </span>
                {" \u00b7 "}Circuit breaks:{" "}
                <span style={{ color: health?.llm_circuit_breaks > 0 ? "#ff4444" : "#556655" }}>
                  {health?.llm_circuit_breaks ?? 0}
                </span>
              </div>
            </div>

          </div>
          {/* Right column - Command Execution Log */}
          <div style={{ width: 480, flexShrink: 0 }}>
            <SectionHeader>Command Execution Log</SectionHeader>
            <CommandExecutionLog commandLog={commandLog} />
          </div>
          </div>
        )}

        {/* UNITS TAB */}
        {tab === "units" && (
          <>
            <SectionHeader>OPFOR Units ({enemyUnits.length})</SectionHeader>
            {enemyUnits.length === 0 ? (
              <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No OPFOR units tracked</div>
            ) : (
              enemyUnits.map((u, i) => <UnitRow key={i} unit={u} />)
            )}

            <SectionHeader>BLUFOR Units ({friendlyUnits.length})</SectionHeader>
            {friendlyUnits.length === 0 ? (
              <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No BLUFOR units tracked</div>
            ) : (
              friendlyUnits.map((u, i) => <UnitRow key={i} unit={u} />)
            )}

            <SectionHeader>Players ({players.length})</SectionHeader>
            {players.length === 0 ? (
              <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No players connected</div>
            ) : (
              players.map((p, i) => (
                <div key={i} style={{ display: "flex", gap: 16, fontSize: 12, fontFamily: "JetBrains Mono", padding: "4px 0", borderBottom: "1px solid rgba(0,255,136,0.06)" }}>
                  <span style={{ color: "#4488ff" }}>Player {p.player_id}</span>
                  <span style={{ color: "#667766" }}>HP: {((p.health_pct || 0) * 100).toFixed(0)}%</span>
                  <span style={{ color: "#556655" }}>{p.is_in_vehicle ? `In ${p.vehicle_type || "vehicle"}` : "On foot"}</span>
                </div>
              ))
            )}

            <SectionHeader>Contacts ({contacts.length})</SectionHeader>
            {contacts.length === 0 ? (
              <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No contacts detected</div>
            ) : (
              contacts.map((c, i) => {
                const conf = (c.confidence || 0) * 100;
                const confColor = conf > 70 ? "#00ff88" : conf > 40 ? "#ffaa00" : "#ff4444";
                const pos = Array.isArray(c.last_known_position) ? c.last_known_position.join(", ") : "\u2014";
                return (
                  <div
                    key={i}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: 12,
                      padding: "6px 0",
                      borderBottom: "1px solid rgba(0,255,136,0.06)",
                      fontSize: 12,
                      fontFamily: "JetBrains Mono",
                    }}
                  >
                    <span style={{ color: "#00ff88", width: 90, flexShrink: 0 }}>{c.contact_id}</span>
                    <span style={{ color: "#889988", width: 110, flexShrink: 0 }}>{c.unit_type}</span>
                    <span style={{ color: confColor, width: 60, flexShrink: 0 }}>{conf.toFixed(0)}%</span>
                    <span style={{ color: "#667766", flex: 1 }}>{pos}</span>
                    <span style={{ color: "#556655", flexShrink: 0 }}>{c.seconds_since_seen != null ? `${c.seconds_since_seen}s ago` : "\u2014"}</span>
                  </div>
                );
              })
            )}
          </>
        )}

        {/* COMMAND LOG TAB */}
        {tab === "commands" && (
          <>
            <SectionHeader>Command History ({allCommands.length} commands{(() => { const m = allCommands.filter(c => c._source === "manual").length; return m > 0 ? `, ${m} manual` : ""; })()}, {commandLog.length} batches)</SectionHeader>
            <div ref={logRef} style={{ maxHeight: 500, overflowY: "auto" }}>
              {commandLog.length === 0 ? (
                <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No commands issued yet</div>
              ) : (
                [...commandLog].reverse().map((batch, batchIdx) => {
                  const batchSource = batch.source || "llm";
                  const batchCmds = (batch.commands?.commands || []).map((cmd) => ({
                    ...cmd,
                    _ts: batch.timestamp,
                    _source: batchSource,
                  }));
                  const narrative = batch.commands?.narrative_broadcast;
                  return (
                    <div key={batchIdx} style={{ marginBottom: 8 }}>
                      {/* Batch header */}
                      <div
                        style={{
                          background: "rgba(0,255,136,0.04)",
                          borderTop: batchIdx > 0 ? "1px solid rgba(0,255,136,0.12)" : "none",
                          padding: "8px 10px 6px",
                          display: "flex",
                          flexWrap: "wrap",
                          alignItems: "center",
                          gap: 12,
                          fontSize: 11,
                          fontFamily: "JetBrains Mono",
                        }}
                      >
                        <span style={{ color: "#889988" }}>{ts(batch.timestamp)}</span>
                        <span
                          style={{
                            fontSize: 9,
                            padding: "1px 6px",
                            letterSpacing: 0.5,
                            fontWeight: 600,
                            background: batchSource === "manual"
                              ? "rgba(255,170,0,0.15)"
                              : "rgba(0,255,136,0.12)",
                            color: batchSource === "manual" ? "#ffaa00" : "#00ff88",
                            border: batchSource === "manual"
                              ? "1px solid rgba(255,170,0,0.3)"
                              : "1px solid rgba(0,255,136,0.3)",
                          }}
                        >
                          {batchSource === "manual" ? "MANUAL" : "LLM"}
                        </span>
                        <span style={{ color: "#667766" }}>
                          {batchCmds.length} cmd{batchCmds.length !== 1 ? "s" : ""}
                        </span>
                        {batch.mission_time != null && (
                          <span style={{ color: "#556655" }}>
                            T+ {fmtTime(batch.mission_time)}
                          </span>
                        )}
                      </div>
                      {/* Narrative broadcast */}
                      {narrative && (
                        <div
                          style={{
                            padding: "4px 10px 6px",
                            background: "rgba(0,255,136,0.02)",
                            fontSize: 11,
                            fontFamily: "JetBrains Mono",
                            fontStyle: "italic",
                            color: "#667766",
                            lineHeight: 1.4,
                          }}
                        >
                          {"\u275d"} {narrative}
                        </div>
                      )}
                      {/* Batch commands */}
                      <div style={{ paddingLeft: 6 }}>
                        {batchCmds.length === 0 ? (
                          <div style={{ color: "#445544", fontSize: 11, fontFamily: "JetBrains Mono", padding: "4px 10px" }}>
                            (no commands in batch)
                          </div>
                        ) : (
                          batchCmds.map((cmd, cmdIdx) => (
                            <CommandEntry key={cmdIdx} cmd={cmd} index={cmdIdx} />
                          ))
                        )}
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </>
        )}

        {/* INTEL TAB */}
        {tab === "intel" && (
          <>
            {/* Tactic Performance */}
            <SectionHeader>Tactic Performance</SectionHeader>
            {(() => {
              const perfData = statsData?.tactic_performance || {};
              const allPerf = Object.values(perfData);
              // Merge all sessions together for display
              const merged = {};
              allPerf.forEach((sessionPerf) => {
                const outcomes = sessionPerf?.tactic_outcomes || {};
                Object.entries(outcomes).forEach(([tactic, data]) => {
                  if (!merged[tactic]) merged[tactic] = { issued: 0, successful: 0, failed: 0 };
                  merged[tactic].issued += data.issued || 0;
                  merged[tactic].successful += data.successful || 0;
                  merged[tactic].failed += data.failed || 0;
                });
              });
              const tacticEntries = Object.entries(merged);
              if (tacticEntries.length === 0) {
                return <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No tactic data yet</div>;
              }

              // Find best and worst
              let bestTactic = null, worstTactic = null, bestRate = -1, worstRate = 2;
              tacticEntries.forEach(([name, d]) => {
                const rate = d.issued > 0 ? d.successful / d.issued : 0;
                if (rate > bestRate) { bestRate = rate; bestTactic = name; }
                if (rate < worstRate) { worstRate = rate; worstTactic = name; }
              });

              return (
                <div style={{ overflowX: "auto" }}>
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12, fontFamily: "JetBrains Mono" }}>
                    <thead>
                      <tr style={{ borderBottom: "1px solid rgba(0,255,136,0.15)" }}>
                        <th style={{ textAlign: "left", padding: "6px 8px", color: "#667766", fontWeight: 500 }}>Tactic</th>
                        <th style={{ textAlign: "right", padding: "6px 8px", color: "#667766", fontWeight: 500 }}>Issued</th>
                        <th style={{ textAlign: "right", padding: "6px 8px", color: "#667766", fontWeight: 500 }}>Success</th>
                        <th style={{ textAlign: "right", padding: "6px 8px", color: "#667766", fontWeight: 500 }}>Failed</th>
                        <th style={{ textAlign: "right", padding: "6px 8px", color: "#667766", fontWeight: 500 }}>Rate</th>
                      </tr>
                    </thead>
                    <tbody>
                      {tacticEntries.map(([name, d]) => {
                        const rate = d.issued > 0 ? (d.successful / d.issued * 100) : 0;
                        const isBest = name === bestTactic && tacticEntries.length > 1;
                        const isWorst = name === worstTactic && tacticEntries.length > 1;
                        const rateColor = rate > 60 ? "#00ff88" : rate > 30 ? "#ffaa00" : "#ff4444";
                        return (
                          <tr key={name} style={{ borderBottom: "1px solid rgba(0,255,136,0.06)" }}>
                            <td style={{ padding: "5px 8px", color: isBest ? "#00ff88" : isWorst ? "#ff4444" : "#ccddcc" }}>
                              {isBest && "\u2605 "}{isWorst && "\u2717 "}{name}
                            </td>
                            <td style={{ padding: "5px 8px", textAlign: "right", color: "#889988" }}>{d.issued}</td>
                            <td style={{ padding: "5px 8px", textAlign: "right", color: "#00ff88" }}>{d.successful}</td>
                            <td style={{ padding: "5px 8px", textAlign: "right", color: "#ff4444" }}>{d.failed}</td>
                            <td style={{ padding: "5px 8px", textAlign: "right" }}>
                              <span style={{ color: rateColor }}>{rate.toFixed(0)}%</span>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              );
            })()}

            {/* Spatial Intelligence */}
            <SectionHeader>Spatial Intelligence</SectionHeader>
            {(() => {
              const spatial = tacticalIntel?.spatial || {};
              const clustering = spatial.player_clustering;
              const zones = spatial.engagement_zones || [];

              if (!clustering && zones.length === 0) {
                return <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No spatial data available</div>;
              }

              return (
                <div style={{ fontSize: 12, fontFamily: "JetBrains Mono" }}>
                  {clustering && (
                    <div style={{ marginBottom: 12 }}>
                      <div style={{ display: "flex", gap: 20, flexWrap: "wrap" }}>
                        <StatCard
                          label="Formation"
                          value={clustering.formation?.replace(/_/g, " ") || "\u2014"}
                          sub={`Spread: ${clustering.avg_spread_m ?? 0}m`}
                          accent="#88bbff"
                        />
                      </div>
                      {clustering.tactical_note && (
                        <div style={{ marginTop: 8, color: "#889988", fontSize: 11, fontStyle: "italic" }}>
                          {clustering.tactical_note}
                        </div>
                      )}
                    </div>
                  )}

                  {zones.length > 0 && (
                    <div>
                      <div style={{ color: "#667766", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", marginBottom: 6 }}>
                        Active Engagement Zones ({zones.length})
                      </div>
                      {zones.map((z, i) => {
                        const intensityColors = { hot: "#ff4444", warm: "#ffaa00", developing: "#88bbff" };
                        const iColor = intensityColors[z.intensity] || "#667766";
                        return (
                          <div key={i} style={{
                            display: "flex", gap: 14, padding: "4px 0",
                            borderBottom: "1px solid rgba(0,255,136,0.06)", alignItems: "center",
                          }}>
                            <span style={{
                              display: "inline-block", width: 8, height: 8, borderRadius: "50%",
                              background: iColor, boxShadow: `0 0 4px ${iColor}66`, flexShrink: 0,
                            }} />
                            <span style={{ color: iColor, width: 80, flexShrink: 0 }}>{z.intensity}</span>
                            <span style={{ color: "#889988" }}>center: {z.center}</span>
                            <span style={{ color: "#667766" }}>radius: {z.radius_m}m</span>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })()}

            {/* Morale Status Panel */}
            <SectionHeader>Morale Status</SectionHeader>
            {(() => {
              const morale = tacticalIntel?.morale || {};
              const overall = morale.overall || "unknown";
              const moraleColors = { strong: "#00ff88", steady: "#ffcc66", shaky: "#ff8844", critical: "#ff4444" };
              const moraleColor = moraleColors[overall] || "#667766";
              const warnings = morale.warnings || [];
              const brokenCount = morale.broken_units || 0;
              const totalUnits = enemyUnits.length;

              return (
                <div style={{ fontSize: 12, fontFamily: "JetBrains Mono" }}>
                  <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
                    <div style={{
                      background: "rgba(0,255,136,0.03)", border: `1px solid ${moraleColor}33`,
                      padding: "14px 18px", minWidth: 160,
                    }}>
                      <div style={{ fontSize: 11, color: "#667766", letterSpacing: 1.5, fontFamily: "JetBrains Mono", textTransform: "uppercase" }}>
                        Overall Morale
                      </div>
                      <div style={{ fontSize: 28, fontWeight: 700, color: moraleColor, fontFamily: "Rajdhani", marginTop: 2, lineHeight: 1, textTransform: "uppercase" }}>
                        {overall}
                      </div>
                      <div style={{ fontSize: 10, color: "#556655", fontFamily: "JetBrains Mono", marginTop: 4 }}>
                        {brokenCount > 0
                          ? `${brokenCount} broken / ${totalUnits} total`
                          : `${totalUnits} units operational`}
                      </div>
                    </div>
                    <StatCard
                      label="Broken Units"
                      value={brokenCount}
                      sub={`of ${totalUnits} total OPFOR`}
                      accent={brokenCount > 0 ? "#ff4444" : "#00ff88"}
                    />
                  </div>

                  {warnings.length > 0 ? (
                    <div>
                      <div style={{ color: "#667766", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", marginBottom: 6 }}>
                        Units Flagged for Retreat / Merge ({warnings.length})
                      </div>
                      {warnings.map((w, i) => {
                        const hp = (w.health_pct || 0) * 100;
                        const hpColor = hp > 50 ? "#ffaa00" : "#ff4444";
                        return (
                          <div key={i} style={{
                            display: "flex", gap: 14, padding: "6px 0", alignItems: "center",
                            borderBottom: "1px solid rgba(0,255,136,0.06)",
                          }}>
                            <span style={{ color: "#ff8844", width: 90, flexShrink: 0, fontWeight: 600 }}>{w.unit_id}</span>
                            <div style={{ width: 80, flexShrink: 0 }}>
                              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                                <div style={{ flex: 1, background: "rgba(0,255,136,0.08)", height: 4, borderRadius: 2, overflow: "hidden" }}>
                                  <div style={{ width: `${hp}%`, height: "100%", background: hpColor, borderRadius: 2 }} />
                                </div>
                                <span style={{ color: hpColor, fontSize: 11 }}>{hp.toFixed(0)}%</span>
                              </div>
                            </div>
                            <span style={{ color: "#667766", width: 60, flexShrink: 0 }}>str: {w.strength ?? "?"}</span>
                            <span style={{ color: "#889988", flex: 1, fontSize: 11 }}>{w.recommendation}</span>
                          </div>
                        );
                      })}
                    </div>
                  ) : (
                    <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No units flagged for retreat or merge</div>
                  )}
                </div>
              );
            })()}

            {/* Counter-Ambush Warnings Panel */}
            <SectionHeader>Counter-Ambush Warnings</SectionHeader>
            {(() => {
              const spatial = tacticalIntel?.spatial || {};
              const ambushWarnings = spatial.ambush_warnings || [];

              if (ambushWarnings.length === 0) {
                return <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No active ambush threats detected</div>;
              }

              // Detect coordinated ambushes: multiple stationary players within 200m of each other
              const coordinated = [];
              for (let i = 0; i < ambushWarnings.length; i++) {
                for (let j = i + 1; j < ambushWarnings.length; j++) {
                  const a = ambushWarnings[i];
                  const b = ambushWarnings[j];
                  const posA = a.position || [0,0,0];
                  const posB = b.position || [0,0,0];
                  const dx = posA[0] - posB[0];
                  const dz = (posA[2] || 0) - (posB[2] || 0);
                  const dist = Math.sqrt(dx*dx + dz*dz);
                  if (dist < 200) {
                    coordinated.push({ players: [a.player_id, b.player_id], distance: Math.round(dist) });
                  }
                }
              }

              return (
                <div style={{ fontSize: 12, fontFamily: "JetBrains Mono" }}>
                  {/* Coordinated ambush alert */}
                  {coordinated.length > 0 && (
                    <div style={{
                      padding: "8px 12px", marginBottom: 12,
                      background: "rgba(255,68,68,0.08)", border: "1px solid rgba(255,68,68,0.25)",
                    }}>
                      <div style={{ color: "#ff4444", fontWeight: 600, fontSize: 11, letterSpacing: 1, textTransform: "uppercase", marginBottom: 4 }}>
                        !! Coordinated Ambush Alert
                      </div>
                      {coordinated.map((c, i) => (
                        <div key={i} style={{ color: "#ff8844", fontSize: 11, padding: "2px 0" }}>
                          Players {c.players.join(" & ")} in crossfire setup ({c.distance}m apart)
                        </div>
                      ))}
                    </div>
                  )}

                  <div style={{ color: "#667766", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", marginBottom: 6 }}>
                    Active Warnings ({ambushWarnings.length})
                  </div>
                  {ambushWarnings.map((w, i) => {
                    const pos = Array.isArray(w.position) ? w.position : [0,0,0];
                    const posStr = `${Math.round(pos[0])}, ${Math.round(pos[2] || 0)}`;
                    const engagements = w.engagements || 0;
                    const engColor = engagements > 5 ? "#ff4444" : engagements > 2 ? "#ff8844" : "#ffaa00";

                    // Compute kill zone info from position and nearby engagement data
                    const bearing = pos[0] !== 0 ? Math.round(Math.atan2(pos[0], pos[2] || 1) * 180 / Math.PI + 360) % 360 : 0;

                    return (
                      <div key={i} style={{
                        padding: "8px 10px", marginBottom: 6,
                        background: "rgba(255,136,0,0.04)", border: "1px solid rgba(255,136,0,0.12)",
                      }}>
                        <div style={{ display: "flex", gap: 14, alignItems: "center", flexWrap: "wrap" }}>
                          <span style={{ color: "#4488ff", fontWeight: 600 }}>Player {w.player_id}</span>
                          <span style={{ color: "#889988" }}>pos: {posStr}</span>
                          <span style={{ color: engColor }}>engagements: {engagements}</span>
                          <span style={{ color: "#667766" }}>stationary: {w.stationary_cycles || "?"} cycles</span>
                        </div>
                        {/* Kill Zone Visualization */}
                        <div style={{ display: "flex", gap: 16, marginTop: 6, fontSize: 11, color: "#667766" }}>
                          <span>bearing: <span style={{ color: "#88bbff" }}>{bearing}{"\u00b0"}</span></span>
                          <span>arc: <span style={{ color: "#88bbff" }}>~120{"\u00b0"}</span></span>
                          <span>depth: <span style={{ color: "#88bbff" }}>~150m</span></span>
                        </div>
                        {/* Safe approach recommendation */}
                        <div style={{ marginTop: 6, fontSize: 11, color: "#aacc88", fontStyle: "italic" }}>
                          Safe approach: flank from {(bearing + 90) % 360}{"\u00b0"} or {(bearing + 270) % 360}{"\u00b0"} {"—"} use smoke/concealment before closing within 100m
                        </div>
                        {/* Threat description */}
                        {w.threat && (
                          <div style={{ marginTop: 4, fontSize: 10, color: "#ff8844" }}>
                            {w.threat}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              );
            })()}

            {/* Player Profile Trends */}
            <SectionHeader>Player Profile Trends</SectionHeader>
            {(() => {
              const profiles = tacticalIntel?.player_profiles || {};
              const entries = Object.entries(profiles);
              if (entries.length === 0) {
                return <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No player profile data</div>;
              }

              // Map styles to trend indicators and predicted actions
              const trendMap = {
                aggressive_assault: { trend: "\u2191", trendLabel: "escalating", predicted: "Push forward with heavy fire", trendColor: "#ff4444" },
                aggressive_push: { trend: "\u2191", trendLabel: "escalating", predicted: "Sustained offensive pressure", trendColor: "#ff4444" },
                flanking_maneuver: { trend: "\u2192", trendLabel: "consistent", predicted: "Continue flanking to side/rear", trendColor: "#ffcc66" },
                defensive_sniper: { trend: "\u2193", trendLabel: "de-escalating", predicted: "Hold position, pick targets", trendColor: "#00aaff" },
                cautious_observer: { trend: "\u2193", trendLabel: "de-escalating", predicted: "Recon before committing", trendColor: "#00aaff" },
                balanced_advance: { trend: "\u2192", trendLabel: "consistent", predicted: "Steady advance with engagement", trendColor: "#ffcc66" },
                unknown: { trend: "\u2014", trendLabel: "unknown", predicted: "Insufficient data", trendColor: "#556655" },
              };

              const styleColors = {
                aggressive_assault: "#ff4444",
                aggressive_push: "#ff6644",
                flanking_maneuver: "#ff8844",
                defensive_sniper: "#00aaff",
                cautious_observer: "#88bbff",
                balanced_advance: "#00ff88",
                unknown: "#556655",
              };

              return (
                <div>
                  {entries.map(([pid, profile]) => {
                    const style = profile.style || "unknown";
                    const confidence = Math.min(profile.confidence || 0, 1);
                    const confPct = (confidence * 100).toFixed(0);
                    const confColor = confidence > 0.7 ? "#00ff88" : confidence > 0.4 ? "#ffaa00" : "#ff4444";
                    const tInfo = trendMap[style] || trendMap.unknown;
                    const sColor = styleColors[style] || "#667766";

                    return (
                      <div key={pid} style={{
                        padding: "10px 12px", marginBottom: 6,
                        background: "rgba(0,255,136,0.03)", border: "1px solid rgba(0,255,136,0.10)",
                        fontSize: 12, fontFamily: "JetBrains Mono",
                      }}>
                        {/* Top row: player ID, style, trend */}
                        <div style={{ display: "flex", gap: 14, alignItems: "center", flexWrap: "wrap" }}>
                          <span style={{ color: "#4488ff", fontWeight: 600, width: 80, flexShrink: 0 }}>Player {pid}</span>
                          <span style={{ color: sColor, fontWeight: 600 }}>{style.replace(/_/g, " ")}</span>
                          <span style={{ color: tInfo.trendColor, fontSize: 14, fontWeight: 700 }}>{tInfo.trend}</span>
                          <span style={{ color: tInfo.trendColor, fontSize: 10 }}>{tInfo.trendLabel}</span>
                          {profile.engagements != null && (
                            <span style={{ color: "#667766", fontSize: 11 }}>{profile.engagements} engagements</span>
                          )}
                          {profile.movement_rate != null && (
                            <span style={{ color: "#556655", fontSize: 11 }}>{profile.movement_rate} m/s avg</span>
                          )}
                        </div>
                        {/* Predicted next action */}
                        <div style={{ marginTop: 6, fontSize: 11, color: "#889988" }}>
                          Predicted: <span style={{ color: "#aacc88" }}>{tInfo.predicted}</span>
                        </div>
                        {/* Confidence progress bar */}
                        <div style={{ marginTop: 6, display: "flex", alignItems: "center", gap: 10 }}>
                          <span style={{ fontSize: 10, color: "#556655", width: 70, flexShrink: 0 }}>Confidence</span>
                          <div style={{ flex: 1, maxWidth: 200, background: "rgba(0,255,136,0.08)", height: 6, borderRadius: 3, overflow: "hidden" }}>
                            <div style={{
                              width: `${confPct}%`, height: "100%",
                              background: confColor, borderRadius: 3,
                              transition: "width 0.3s ease",
                            }} />
                          </div>
                          <span style={{ color: confColor, fontSize: 11, width: 36, textAlign: "right", flexShrink: 0 }}>{confPct}%</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })()}

            {/* Player Movement Vectors */}
            <SectionHeader>Player Movement Vectors</SectionHeader>
            {(() => {
              const vectors = tacticalIntel?.player_vectors || {};
              const entries = Object.entries(vectors);
              if (entries.length === 0) {
                return <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No player vector data</div>;
              }
              return (
                <div>
                  {entries.map(([pid, vec]) => {
                    const speed = vec.speed_mps || 0;
                    const speedColor = vec.is_sprinting ? "#ff4444" : vec.is_moving ? "#00aaff" : "#556655";
                    const heading = vec.heading || 0;
                    const dir = vec.predicted_direction || "unknown";
                    return (
                      <div key={pid} style={{
                        display: "flex", gap: 16, padding: "5px 0", alignItems: "center",
                        borderBottom: "1px solid rgba(0,255,136,0.06)",
                        fontSize: 12, fontFamily: "JetBrains Mono",
                      }}>
                        <span style={{ color: "#4488ff", width: 80, flexShrink: 0 }}>Player {pid}</span>
                        <span style={{ color: "#889988", width: 80, flexShrink: 0 }}>hdg: {heading.toFixed(0)}\u00b0</span>
                        <span style={{ color: speedColor, width: 80, flexShrink: 0 }}>{speed.toFixed(1)} m/s</span>
                        <span style={{ color: "#00ff88" }}>\u2192 {dir.replace(/_/g, " ")}</span>
                        {vec.is_sprinting && (
                          <span style={{ fontSize: 9, padding: "1px 5px", background: "rgba(255,68,68,0.15)", color: "#ff4444", border: "1px solid rgba(255,68,68,0.3)" }}>SPRINT</span>
                        )}
                      </div>
                    );
                  })}
                </div>
              );
            })()}

            {/* Per-Unit Combat Stats */}
            <SectionHeader>Unit Combat Stats</SectionHeader>
            {(() => {
              const allUnits = [...enemyUnits, ...friendlyUnits];
              const unitsWithStats = allUnits.filter(u => u.kills != null || u.casualties != null);
              if (unitsWithStats.length === 0) {
                return <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No combat stats reported</div>;
              }
              return (
                <div style={{ overflowX: "auto" }}>
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12, fontFamily: "JetBrains Mono" }}>
                    <thead>
                      <tr style={{ borderBottom: "1px solid rgba(0,255,136,0.15)" }}>
                        <th style={{ textAlign: "left", padding: "6px 8px", color: "#667766", fontWeight: 500 }}>Unit</th>
                        <th style={{ textAlign: "left", padding: "6px 8px", color: "#667766", fontWeight: 500 }}>Type</th>
                        <th style={{ textAlign: "right", padding: "6px 8px", color: "#667766", fontWeight: 500 }}>Kills</th>
                        <th style={{ textAlign: "right", padding: "6px 8px", color: "#667766", fontWeight: 500 }}>Casualties</th>
                        <th style={{ textAlign: "right", padding: "6px 8px", color: "#667766", fontWeight: 500 }}>K/C Ratio</th>
                      </tr>
                    </thead>
                    <tbody>
                      {unitsWithStats.map((u, i) => {
                        const kills = u.kills || 0;
                        const cas = u.casualties || 0;
                        const ratio = cas > 0 ? (kills / cas) : kills > 0 ? "\u221e" : "\u2014";
                        const ratioColor = typeof ratio === "number" ? (ratio >= 1 ? "#00ff88" : "#ff4444") : ratio === "\u221e" ? "#00ff88" : "#556655";
                        return (
                          <tr key={i} style={{ borderBottom: "1px solid rgba(0,255,136,0.06)" }}>
                            <td style={{ padding: "5px 8px", color: "#00ff88" }}>{u.unit_id}</td>
                            <td style={{ padding: "5px 8px", color: "#889988" }}>{u.unit_type}</td>
                            <td style={{ padding: "5px 8px", textAlign: "right", color: "#ff4444" }}>{kills}</td>
                            <td style={{ padding: "5px 8px", textAlign: "right", color: "#ffaa00" }}>{cas}</td>
                            <td style={{ padding: "5px 8px", textAlign: "right", color: ratioColor }}>
                              {typeof ratio === "number" ? ratio.toFixed(1) : ratio}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              );
            })()}

            {/* Terrain Overview */}
            <SectionHeader>Terrain Overview</SectionHeader>
            {(() => {
              const terrain = tacticalIntel?.terrain_summary || {};
              const entries = Object.entries(terrain);
              if (entries.length === 0) {
                return <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono" }}>No terrain data available</div>;
              }
              return (
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  {entries.map(([type, data]) => {
                    const coverPct = ((data.avg_cover || 0) * 100).toFixed(0);
                    const coverColor = data.avg_cover > 0.6 ? "#00ff88" : data.avg_cover > 0.3 ? "#ffaa00" : "#ff8844";
                    return (
                      <div key={type} style={{
                        background: "rgba(0,255,136,0.03)", border: "1px solid rgba(0,255,136,0.12)",
                        padding: "10px 16px", minWidth: 130,
                      }}>
                        <div style={{ fontSize: 11, color: "#667766", letterSpacing: 1.5, fontFamily: "JetBrains Mono", textTransform: "uppercase" }}>
                          {type}
                        </div>
                        <div style={{ fontSize: 22, fontWeight: 700, color: coverColor, fontFamily: "Rajdhani", marginTop: 2 }}>
                          {coverPct}%
                        </div>
                        <div style={{ fontSize: 10, color: "#556655", fontFamily: "JetBrains Mono", marginTop: 2 }}>
                          cover \u00b7 {data.count || 0} sample{(data.count || 0) !== 1 ? "s" : ""}
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })()}
          </>
        )}

        {/* MANUAL CONTROL TAB */}
        {tab === "manual" && (
          <>
            <SectionHeader>Manual Command Injection</SectionHeader>
            <div style={{ fontSize: 12, color: "#556655", fontFamily: "JetBrains Mono", marginBottom: 14 }}>
              Send commands directly to the game, bypassing the LLM. Commands are merged into the next SITREP response.
            </div>
            <ManualCommandPanel queueCommand={queueCommand} busy={busyAction === "manual"} />

            <SectionHeader>Quick Actions</SectionHeader>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {quickActions.map((q) => (
                <button
                  key={q.label}
                  disabled={!!busyAction}
                  onClick={() => queueQuickAction(q)}
                  style={{
                    background: "transparent",
                    border: `1px solid ${q.color}44`,
                    color: q.color,
                    padding: "6px 16px",
                    fontFamily: "JetBrains Mono",
                    fontSize: 11,
                    cursor: busyAction ? "wait" : "pointer",
                    letterSpacing: 0.5,
                    opacity: busyAction ? 0.55 : 1,
                  }}
                >
                  {busyAction === `quick:${q.label}` ? `… ${q.label}` : q.label}
                </button>
              ))}
            </div>
            <ActionStatus status={actionStatus} />

            <SectionHeader>Mission Control</SectionHeader>
            <div style={{ display: "flex", gap: 8 }}>
              <button
                disabled={!!busyAction}
                onClick={resetMission}
                style={{
                  background: "rgba(255,68,68,0.08)",
                  border: "1px solid rgba(255,68,68,0.25)",
                  color: "#ff4444",
                  padding: "8px 20px",
                  fontFamily: "JetBrains Mono",
                  fontSize: 11,
                  cursor: busyAction ? "wait" : "pointer",
                  letterSpacing: 1,
                  textTransform: "uppercase",
                  opacity: busyAction ? 0.6 : 1,
                }}
              >
                {busyAction === "reset" ? "… Resetting" : "\u27f3 Reset Mission"}
              </button>
            </div>
          </>
        )}

        {/* SERVER TAB */}
        {tab === "server" && (
          <ServerTab
            serverStatus={serverStatus}
            serverError={serverError}
            fetchJson={fetchJson}
            onServerAction={handleServerAction}
            busyAction={busyAction}
            onRefreshPlayers={fetchServerStatus}
            onKickPlayer={handleKickPlayer}
            metrics={serverMetrics}
            health={health}
          />
        )}
      </div>

      {/* Footer */}
      <div
        style={{
          position: "fixed",
          bottom: 0,
          left: 0,
          right: 0,
          padding: "6px 24px",
          background: "#0a0f0a",
          borderTop: "1px solid rgba(0,255,136,0.08)",
          display: "flex",
          justifyContent: "space-between",
          fontSize: 10,
          fontFamily: "JetBrains Mono",
          color: "#334433",
        }}
      >
        <span>SITREP age: {gameState?.age_seconds != null ? `${fmt(gameState.age_seconds)}s` : "\u2014"}</span>
        <span>Polling every {POLL_INTERVAL / 1000}s</span>
        <span>{new Date().toLocaleTimeString()}</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard />);
</script>
</body>
</html>
