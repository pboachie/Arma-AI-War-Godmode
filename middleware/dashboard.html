<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI War — Autonomous LLM Command</title>
<link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="12" fill="%230a0f0a"/%3E%3Cpath d="M32 10 50 24v16L32 54 14 40V24z" fill="none" stroke="%2300ff88" stroke-width="4"/%3E%3Ccircle cx="32" cy="32" r="6" fill="%2300ff88"/%3E%3C/svg%3E'>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0f0a; }
  button:hover { filter: brightness(1.3); }
  button:active { filter: brightness(0.9); transform: scale(0.98); }
  select:hover { border-color: rgba(0,255,136,0.35) !important; }
  input:focus, select:focus { border-color: rgba(0,255,136,0.4) !important; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0a0f0a; }
  ::-webkit-scrollbar-thumb { background: rgba(0,255,136,0.15); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,255,136,0.3); }
  ::selection { background: rgba(0,255,136,0.2); color: #ccddcc; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const API_BASE = window.location.origin;
const POLL_INTERVAL = 3000;
const STATUS_TIMEOUT = 3200;

// ── Utility ──
const fmt = (n) => (typeof n === "number" ? n.toFixed(1) : "\u2014");
const fmtTime = (s) => {
  if (!s && s !== 0) return "\u2014";
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  const sec = Math.floor(s % 60);
  if (h > 0) return `${h}h ${m % 60}m`;
  return `${m}m ${sec}s`;
};

const ts = (epoch) => {
  if (!epoch) return "\u2014";
  return new Date(epoch * 1000).toLocaleTimeString();
};

// ═══════════════════════════════════════════════
// COMPONENTS
// ═══════════════════════════════════════════════

function StatusDot({ state }) {
  const palette = {
    connected: { fill: "#00ff88", glow: "#00ff8866" },
    connecting: { fill: "#ffcc66", glow: "#ffcc6666" },
    offline: { fill: "#ff4444", glow: "#ff444466" },
  };
  const tone = palette[state] || palette.offline;
  return (
    <span
      style={{
        display: "inline-block",
        width: 8,
        height: 8,
        borderRadius: "50%",
        background: tone.fill,
        boxShadow: `0 0 6px ${tone.glow}`,
        marginRight: 8,
      }}
    />
  );
}

function StatCard({ label, value, sub, accent }) {
  return (
    <div
      style={{
        background: "rgba(0,255,136,0.03)",
        border: "1px solid rgba(0,255,136,0.12)",
        padding: "14px 18px",
        flex: 1,
        minWidth: 140,
      }}
    >
      <div style={{ fontSize: 11, color: "#667766", letterSpacing: 1.5, fontFamily: "JetBrains Mono", textTransform: "uppercase" }}>
        {label}
      </div>
      <div style={{ fontSize: 28, fontWeight: 700, color: accent || "#00ff88", fontFamily: "Rajdhani", marginTop: 2, lineHeight: 1 }}>
        {value}
      </div>
      {sub && <div style={{ fontSize: 11, color: "#556655", fontFamily: "JetBrains Mono", marginTop: 4 }}>{sub}</div>}
    </div>
  );
}

function SectionHeader({ children }) {
  return (
    <div
      style={{
        fontSize: 11,
        letterSpacing: 2,
        color: "#00ff88",
        fontFamily: "JetBrains Mono",
        textTransform: "uppercase",
        borderBottom: "1px solid rgba(0,255,136,0.15)",
        paddingBottom: 6,
        marginBottom: 12,
        marginTop: 24,
      }}
    >
      \u25a0 {children}
    </div>
  );
}

function ActionStatus({ status }) {
  if (!status) return null;

  const tones = {
    success: {
      color: "#00ff88",
      background: "rgba(0,255,136,0.08)",
      border: "1px solid rgba(0,255,136,0.18)",
    },
    error: {
      color: "#ff6666",
      background: "rgba(255,68,68,0.08)",
      border: "1px solid rgba(255,68,68,0.22)",
    },
    info: {
      color: "#88bbff",
      background: "rgba(136,187,255,0.08)",
      border: "1px solid rgba(136,187,255,0.18)",
    },
  };

  const tone = tones[status.type] || tones.info;

  return (
    <div
      style={{
        marginTop: 12,
        padding: "8px 10px",
        fontSize: 11,
        fontFamily: "JetBrains Mono",
        lineHeight: 1.4,
        ...tone,
      }}
    >
      {status.message}
    </div>
  );
}

// ── LLM Health Indicator ──
function LLMHealthIndicator({ statsData }) {
  if (!statsData) return null;

  const retries = statsData.llm_retries || 0;
  const rate429 = statsData.llm_429s || 0;
  const circuitStatus = statsData.llm_circuit_status || "closed";
  const inflight = statsData.llm_inflight || 0;
  const maxConcurrent = statsData.llm_max_concurrent || 1;
  const consecutiveFailures = statsData.llm_consecutive_failures || 0;

  // Determine overall health: green/yellow/red
  let healthState = "healthy";
  let healthColor = "#00ff88";
  let healthGlow = "#00ff8844";
  let healthLabel = "HEALTHY";

  if (circuitStatus === "open") {
    healthState = "critical";
    healthColor = "#ff4444";
    healthGlow = "#ff444444";
    healthLabel = "CIRCUIT OPEN";
  } else if (circuitStatus === "half-open") {
    healthState = "recovering";
    healthColor = "#ffaa00";
    healthGlow = "#ffaa0044";
    healthLabel = "RECOVERING";
  } else if (consecutiveFailures > 0 || retries > 0) {
    healthState = "degraded";
    healthColor = "#ffcc66";
    healthGlow = "#ffcc6644";
    healthLabel = "RETRYING";
  }

  return (
    <div
      style={{
        background: "rgba(0,255,136,0.03)",
        border: `1px solid ${healthColor}33`,
        padding: "14px 18px",
      }}
    >
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
        <span
          style={{
            display: "inline-block",
            width: 10,
            height: 10,
            borderRadius: "50%",
            background: healthColor,
            boxShadow: `0 0 8px ${healthGlow}`,
            animation: healthState !== "healthy" ? "pulse 1.5s ease-in-out infinite" : "none",
          }}
        />
        <span style={{ fontSize: 11, letterSpacing: 1.5, fontFamily: "JetBrains Mono", color: healthColor, textTransform: "uppercase", fontWeight: 600 }}>
          LLM {healthLabel}
        </span>
      </div>
      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", fontSize: 11, fontFamily: "JetBrains Mono", color: "#667766" }}>
        <div>
          Retries: <span style={{ color: retries > 0 ? "#ffcc66" : "#556655" }}>{retries}</span>
        </div>
        <div>
          429s: <span style={{ color: rate429 > 0 ? "#ff8844" : "#556655" }}>{rate429}</span>
        </div>
        <div>
          Circuit: <span style={{ color: circuitStatus === "closed" ? "#00ff88" : circuitStatus === "open" ? "#ff4444" : "#ffaa00" }}>{circuitStatus}</span>
        </div>
        <div>
          In-flight: <span style={{ color: "#88bbff" }}>{inflight}/{maxConcurrent}</span>
        </div>
        {consecutiveFailures > 0 && (
          <div>
            Consecutive fails: <span style={{ color: "#ff4444" }}>{consecutiveFailures}</span>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Response Time Sparkline (CSS-only) ──
function ResponseTimeSparkline({ times }) {
  if (!times || times.length === 0) {
    return (
      <div style={{ fontSize: 11, fontFamily: "JetBrains Mono", color: "#445544" }}>
        No response time data yet
      </div>
    );
  }

  const maxVal = Math.max(...times, 1);
  const minVal = Math.min(...times);
  const avgVal = times.reduce((a, b) => a + b, 0) / times.length;
  const latest = times[times.length - 1];

  // Color the latest bar based on trend: compare to average
  const trendColor = latest > avgVal * 1.5 ? "#ff4444" : latest > avgVal * 1.1 ? "#ffcc66" : "#00ff88";

  return (
    <div style={{
      background: "rgba(0,255,136,0.03)",
      border: "1px solid rgba(0,255,136,0.12)",
      padding: "14px 18px",
    }}>
      <div style={{ fontSize: 11, color: "#667766", letterSpacing: 1.5, fontFamily: "JetBrains Mono", textTransform: "uppercase", marginBottom: 8 }}>
        Response Time Trend
      </div>
      <div style={{ display: "flex", alignItems: "flex-end", gap: 3, height: 40 }}>
        {times.map((t, i) => {
          const heightPct = Math.max((t / maxVal) * 100, 4);
          const isLatest = i === times.length - 1;
          const barColor = isLatest ? trendColor : "rgba(0,255,136,0.35)";
          return (
            <div
              key={i}
              title={`${t}ms`}
              style={{
                flex: 1,
                height: `${heightPct}%`,
                background: barColor,
                borderRadius: "1px 1px 0 0",
                minWidth: 6,
                transition: "height 0.3s ease",
              }}
            />
          );
        })}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, fontSize: 10, fontFamily: "JetBrains Mono", color: "#556655" }}>
        <span>min: <span style={{ color: "#889988" }}>{minVal}ms</span></span>
        <span>avg: <span style={{ color: "#889988" }}>{Math.round(avgVal)}ms</span></span>
        <span>latest: <span style={{ color: trendColor }}>{latest}ms</span></span>
      </div>
    </div>
  );
}

// ── Error Rate Display ──
function ErrorRateDisplay({ health }) {
  if (!health) return null;

  const totalReqs = health.total_requests || 0;
  const totalErrs = health.total_errors || 0;
  const errorRate = totalReqs > 0 ? (totalErrs / totalReqs) * 100 : 0;

  let rateColor = "#00ff88";
  let rateLabel = "NOMINAL";
  let rateBg = "rgba(0,255,136,0.06)";
  let rateBorder = "rgba(0,255,136,0.20)";

  if (errorRate > 10) {
    rateColor = "#ff4444";
    rateLabel = "CRITICAL";
    rateBg = "rgba(255,68,68,0.06)";
    rateBorder = "rgba(255,68,68,0.25)";
  } else if (errorRate >= 5) {
    rateColor = "#ffcc66";
    rateLabel = "ELEVATED";
    rateBg = "rgba(255,204,102,0.06)";
    rateBorder = "rgba(255,204,102,0.25)";
  }

  return (
    <div style={{
      background: rateBg,
      border: `1px solid ${rateBorder}`,
      padding: "14px 18px",
      flex: 1,
      minWidth: 140,
    }}>
      <div style={{ fontSize: 11, color: "#667766", letterSpacing: 1.5, fontFamily: "JetBrains Mono", textTransform: "uppercase" }}>
        Error Rate
      </div>
      <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginTop: 2 }}>
        <span style={{ fontSize: 28, fontWeight: 700, color: rateColor, fontFamily: "Rajdhani", lineHeight: 1 }}>
          {errorRate.toFixed(1)}%
        </span>
        <span style={{ fontSize: 10, fontFamily: "JetBrains Mono", color: rateColor, letterSpacing: 1, textTransform: "uppercase" }}>
          {rateLabel}
        </span>
      </div>
      <div style={{ fontSize: 11, color: "#556655", fontFamily: "JetBrains Mono", marginTop: 4 }}>
        {totalErrs} errors / {totalReqs} requests
      </div>
      {/* Error rate progress bar */}
      <div style={{ marginTop: 6, background: "rgba(0,255,136,0.08)", height: 4, borderRadius: 2, overflow: "hidden" }}>
        <div style={{
          width: `${Math.min(errorRate, 100)}%`,
          height: "100%",
          background: rateColor,
          borderRadius: 2,
          transition: "width 0.3s ease",
        }} />
      </div>
    </div>
  );
}

// ── Command Execution Log (recent 20) ──
function CommandExecutionLog({ commandLog }) {
  const logEndRef = useRef(null);
  const containerRef = useRef(null);
  const [autoScroll, setAutoScroll] = useState(true);
  const prevCountRef = useRef(0);

  // Flatten and take last 20 commands
  const recentCommands = [];
  for (let i = commandLog.length - 1; i >= 0 && recentCommands.length < 20; i--) {
    const batch = commandLog[i];
    const cmds = (batch.commands?.commands || []).map((cmd) => ({
      ...cmd,
      _ts: batch.timestamp,
      _source: batch.source || "llm",
      _response_time_ms: batch.response_time_ms,
    }));
    for (let j = cmds.length - 1; j >= 0 && recentCommands.length < 20; j--) {
      recentCommands.unshift(cmds[j]);
    }
  }

  // Auto-scroll on new entries
  useEffect(() => {
    if (autoScroll && recentCommands.length > prevCountRef.current && logEndRef.current) {
      logEndRef.current.scrollIntoView({ behavior: "smooth" });
    }
    prevCountRef.current = recentCommands.length;
  }, [recentCommands.length, autoScroll]);

  // Detect manual scroll
  const handleScroll = useCallback(() => {
    if (!containerRef.current) return;
    const el = containerRef.current;
    const isAtBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
    setAutoScroll(isAtBottom);
  }, []);

  // Color mapping by command category
  const getTypeColor = (type) => {
    if (!type) return "#667766";
    const t = type.toLowerCase();
    // Spawn commands: blue
    if (t.includes("spawn") || t.includes("reinforcement")) return "#4488ff";
    // Combat commands: red
    if (t === "attack" || t === "defend" || t === "set_ambush" || t === "seek_and_destroy") return "#ff4444";
    // Movement commands: green
    if (t === "move" || t === "patrol" || t === "retreat") return "#00ff88";
    // Effects commands: yellow
    if (t === "explosion" || t === "smoke" || t === "flare" || t === "thunder_near") return "#ffcc66";
    // Environment
    if (t.includes("weather") || t.includes("time") || t.includes("wind")) return "#88ddff";
    // Cleanup
    if (t.includes("cleanup") || t.includes("despawn")) return "#889988";
    return "#667766";
  };

  const getCategoryLabel = (type) => {
    if (!type) return "";
    const t = type.toLowerCase();
    if (t.includes("spawn") || t.includes("reinforcement")) return "SPAWN";
    if (t === "attack" || t === "defend" || t === "set_ambush" || t === "seek_and_destroy") return "COMBAT";
    if (t === "move" || t === "patrol" || t === "retreat") return "MOVE";
    if (t === "explosion" || t === "smoke" || t === "flare" || t === "thunder_near") return "EFFECT";
    if (t.includes("weather") || t.includes("time") || t.includes("wind")) return "ENV";
    if (t.includes("cleanup") || t.includes("despawn")) return "CLEAN";
    return "OTHER";
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
        <span style={{ fontSize: 10, fontFamily: "JetBrains Mono", color: "#556655" }}>
          Showing last {recentCommands.length} of 20 max
        </span>
        <span style={{
          fontSize: 9, fontFamily: "JetBrains Mono",
          color: autoScroll ? "#00ff88" : "#556655",
          letterSpacing: 0.5,
        }}>
          {autoScroll ? "AUTO-SCROLL ON" : "AUTO-SCROLL OFF"}
        </span>
      </div>
      <div
        ref={containerRef}
        onScroll={handleScroll}
        style={{
          maxHeight: 320,
          overflowY: "auto",
          border: "1px solid rgba(0,255,136,0.10)",
          background: "rgba(0,0,0,0.2)",
        }}
      >
        {recentCommands.length === 0 ? (
          <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono", padding: "16px 12px", textAlign: "center" }}>
            No commands executed yet
          </div>
        ) : (
          recentCommands.map((cmd, i) => {
            const typeColor = getTypeColor(cmd.command_type);
            const catLabel = getCategoryLabel(cmd.command_type);
            const narrative = cmd.narrative || "";
            const truncNarrative = narrative.length > 60 ? narrative.slice(0, 57) + "..." : narrative;
            const posStr = cmd.target_position
              ? (typeof cmd.target_position === "string" ? cmd.target_position : JSON.stringify(cmd.target_position))
              : "";

            return (
              <div
                key={i}
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 8,
                  padding: "5px 10px",
                  borderBottom: "1px solid rgba(0,255,136,0.05)",
                  fontSize: 11,
                  fontFamily: "JetBrains Mono",
                  borderLeft: `3px solid ${typeColor}`,
                }}
              >
                <span style={{ color: "#445544", width: 62, flexShrink: 0, fontSize: 10 }}>{ts(cmd._ts)}</span>
                <span style={{
                  fontSize: 8, padding: "1px 4px", letterSpacing: 0.5, fontWeight: 600,
                  background: `${typeColor}18`, color: typeColor, border: `1px solid ${typeColor}44`,
                  width: 48, textAlign: "center", flexShrink: 0,
                }}>
                  {catLabel}
                </span>
                <span style={{ color: typeColor, width: 120, flexShrink: 0, fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {cmd.command_type}
                </span>
                <span style={{ color: "#667766", width: 70, flexShrink: 0 }}>{cmd.unit_id || "\u2014"}</span>
                <span style={{ color: "#556655", width: 100, flexShrink: 0, fontSize: 10, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {posStr || "\u2014"}
                </span>
                <span style={{ color: "#556655", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", fontSize: 10, fontStyle: "italic" }}>
                  {truncNarrative || "\u2014"}
                </span>
              </div>
            );
          })
        )}
        <div ref={logEndRef} />
      </div>
    </div>
  );
}

function UnitRow({ unit }) {
  const hp = (unit.health_pct || 0) * 100;
  const hpColor = hp > 60 ? "#00ff88" : hp > 30 ? "#ffaa00" : "#ff4444";
  const orderColors = { patrol: "#00ff88", defend: "#ffaa00", attack: "#ff4444", move: "#00aaff" };
  const orderColor = orderColors[unit.current_order] || "#667766";
  const pos = Array.isArray(unit.position) ? `${unit.position[0]}, ${unit.position[2]}` : "\u2014";
  const statusColors = { completed: "#00ff88", executing: "#00aaff", stuck: "#ff4444", engaged: "#ffaa00" };
  const oStatus = unit.order_status || null;
  const oStatusColor = statusColors[oStatus] || "#556655";
  return (
    <div
      style={{
        padding: "6px 0",
        borderBottom: "1px solid rgba(0,255,136,0.06)",
        fontSize: 12,
        fontFamily: "JetBrains Mono",
      }}
    >
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <span style={{ color: "#00ff88", width: 80, flexShrink: 0 }}>{unit.unit_id}</span>
        <span style={{ color: "#889988", width: 100, flexShrink: 0 }}>{unit.unit_type}</span>
        <span style={{ color: orderColor, flexShrink: 0, fontSize: 11, width: 70 }}>{unit.current_order || "\u2014"}</span>
        <span style={{ color: "#667766", width: 50, flexShrink: 0 }}>str:{unit.strength || "?"}</span>
        <span style={{ color: "#556655", width: 120, flexShrink: 0, fontSize: 11 }}>{pos}</span>
        <div style={{ flex: 1, background: "rgba(0,255,136,0.08)", height: 4, borderRadius: 2, overflow: "hidden" }}>
          <div style={{ width: `${hp}%`, height: "100%", background: hpColor, borderRadius: 2 }} />
        </div>
        <span style={{ color: hpColor, width: 40, textAlign: "right", flexShrink: 0 }}>{hp.toFixed(0)}%</span>
      </div>
      {/* Extended unit info row */}
      <div style={{ display: "flex", gap: 16, paddingLeft: 80, marginTop: 2, fontSize: 10, color: "#556655" }}>
        {oStatus && (
          <span>status: <span style={{ color: oStatusColor }}>{oStatus}</span></span>
        )}
        {unit.distance_to_objective != null && (
          <span>obj dist: <span style={{ color: "#88bbff" }}>{Math.round(unit.distance_to_objective)}m</span></span>
        )}
        {unit.time_since_order != null && (
          <span>order age: <span style={{ color: "#889988" }}>{fmtTime(unit.time_since_order)}</span></span>
        )}
        {(unit.kills != null || unit.casualties != null) && (
          <span>
            {unit.kills != null && <><span style={{ color: "#ff4444" }}>{unit.kills}K</span> </>}
            {unit.casualties != null && <span style={{ color: "#ffaa00" }}>{unit.casualties}C</span>}
          </span>
        )}
      </div>
    </div>
  );
}

function CommandEntry({ cmd, index }) {
  const [expanded, setExpanded] = useState(false);
  const typeColors = {
    move: "#00aaff", attack: "#ff4444", defend: "#ffaa00", patrol: "#00ff88",
    spawn_infantry: "#aa88ff", spawn_vehicle: "#ff88aa", set_weather: "#88ddff",
    retreat: "#ffcc00", explosion: "#ff6600", smoke: "#aaaaaa",
  };
  const color = typeColors[cmd.command_type] || "#00ff88";

  return (
    <div
      style={{
        borderLeft: `2px solid ${color}`,
        padding: "6px 10px",
        marginBottom: 4,
        background: expanded ? "rgba(0,255,136,0.04)" : "transparent",
        cursor: "pointer",
        transition: "background 0.15s",
      }}
      onClick={() => setExpanded(!expanded)}
    >
      <div style={{ display: "flex", gap: 10, fontSize: 12, fontFamily: "JetBrains Mono", alignItems: "center" }}>
        {cmd._source === "manual" && (
          <span style={{ fontSize: 9, padding: "1px 5px", background: "rgba(255,170,0,0.15)", color: "#ffaa00", border: "1px solid rgba(255,170,0,0.3)", letterSpacing: 0.5, flexShrink: 0 }}>MAN</span>
        )}
        <span style={{ color, fontWeight: 600, width: 140, flexShrink: 0 }}>{cmd.command_type}</span>
        <span style={{ color: "#667766", width: 80, flexShrink: 0 }}>{cmd.unit_id || "\u2014"}</span>
        <span style={{ color: "#556655", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
          {cmd.narrative || (typeof cmd.parameters === "string" ? cmd.parameters : JSON.stringify(cmd.parameters)) || ""}
        </span>
        {cmd._ts && <span style={{ color: "#334433", fontSize: 10, flexShrink: 0 }}>{ts(cmd._ts)}</span>}
      </div>
      {expanded && (

}

// ── Alert Banner ──
function AlertBanner({ serverStatus, metrics, health }) {
  const [dismissed, setDismissed] = useState({});
  const dismiss = useCallback((key) => {
    setDismissed(prev => ({ ...prev, [key]: Date.now() }));
  }, []);

  const alerts = [];
  const proc = serverStatus?.process || {};
  const a2s = serverStatus?.a2s || {};
  const rcon = serverStatus?.rcon || {};
  const cpu = metrics?.cpu_percent;
  const mem = metrics?.memory_percent;
  const totalReqs = health?.total_requests || 0;
  const totalErrs = health?.total_errors || 0;
  const errorRate = totalReqs > 0 ? (totalErrs / totalReqs) * 100 : 0;
  const isRunning = proc.running === true;

  if (proc.running === false && serverStatus) alerts.push({ key: "srv-offline", severity: "red", label: "CRITICAL", message: "SERVER OFFLINE" });
  if (proc.docker_available === false) alerts.push({ key: "docker-unavail", severity: "red", label: "CRITICAL", message: "DOCKER NOT AVAILABLE" });
  if (typeof cpu === "number" && cpu > 90) alerts.push({ key: "cpu-crit", severity: "red", label: "CRITICAL", message: `CPU CRITICAL: ${cpu.toFixed(1)}%` });
  else if (typeof cpu === "number" && cpu > 75) alerts.push({ key: "cpu-high", severity: "yellow", label: "WARNING", message: `CPU HIGH: ${cpu.toFixed(1)}%` });
  if (typeof mem === "number" && mem > 90) alerts.push({ key: "mem-crit", severity: "red", label: "CRITICAL", message: `MEMORY CRITICAL: ${mem.toFixed(1)}%` });
  else if (typeof mem === "number" && mem > 75) alerts.push({ key: "mem-high", severity: "yellow", label: "WARNING", message: `MEMORY HIGH: ${mem.toFixed(1)}%` });
  if (totalReqs > 0 && errorRate > 10) alerts.push({ key: "err-rate", severity: "red", label: "CRITICAL", message: `ERROR RATE CRITICAL: ${errorRate.toFixed(1)}%` });
  if (isRunning && rcon.connected === false) alerts.push({ key: "rcon-disc", severity: "yellow", label: "WARNING", message: "RCON DISCONNECTED" });
  if (isRunning && a2s.online === false) alerts.push({ key: "a2s-off", severity: "yellow", label: "WARNING", message: "A2S QUERY OFFLINE" });
  if (proc.last_crash) alerts.push({ key: "recent-crash", severity: "yellow", label: "WARNING", message: "RECENT CRASH DETECTED" });

  alerts.sort((a, b) => (a.severity === "red" ? 0 : 1) - (b.severity === "red" ? 0 : 1));
  const visibleAlerts = alerts.filter(a => { const d = dismissed[a.key]; return !d || (Date.now() - d) >= 60000; });
  const palette = { red: { bg: "rgba(255,68,68,0.12)", border: "#ff4444" }, yellow: { bg: "rgba(255,170,0,0.12)", border: "#ffaa00" } };
  const timestamp = new Date().toLocaleTimeString();

  if (visibleAlerts.length === 0) {
    return (
      <div style={{ background: "rgba(0,255,136,0.06)", borderLeft: "3px solid #00ff88", padding: "6px 14px", fontFamily: "JetBrains Mono", fontSize: 11, color: "#00ff88", letterSpacing: 1.5, textTransform: "uppercase", display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
        <span style={{ display: "inline-block", width: 6, height: 6, borderRadius: "50%", background: "#00ff88", boxShadow: "0 0 6px #00ff8866" }} />
        All Systems Nominal
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 8 }}>
      {visibleAlerts.map((alert) => {
        const p = palette[alert.severity];
        return (
          <div key={alert.key} style={{ background: p.bg, borderLeft: `3px solid ${p.border}`, padding: "7px 12px", display: "flex", alignItems: "center", gap: 10, fontFamily: "JetBrains Mono", fontSize: 11 }}>
            <span style={{ display: "inline-block", width: 7, height: 7, borderRadius: "50%", background: p.border, boxShadow: `0 0 6px ${p.border}66`, flexShrink: 0 }} />
            <span style={{ color: p.border, fontWeight: 700, letterSpacing: 1.5, fontSize: 10, textTransform: "uppercase", flexShrink: 0, fontFamily: "Rajdhani" }}>{alert.label}</span>
            <span style={{ color: "#ccddcc", letterSpacing: 0.5, flex: 1 }}>{alert.message}</span>
            <span style={{ color: "#556655", fontSize: 10, flexShrink: 0 }}>{timestamp}</span>
            <button onClick={() => dismiss(alert.key)} title="Dismiss for 60s" style={{ background: "none", border: `1px solid ${p.border}33`, color: p.border, cursor: "pointer", padding: "1px 6px", fontFamily: "JetBrains Mono", fontSize: 11, lineHeight: 1, opacity: 0.7, flexShrink: 0 }}>{"\u2715"}</button>
          </div>
        );
      })}
    </div>
  );
}

// ── IHOP Health Dashboard ──
function IHOPHealthDashboard({ serverStatus, metrics, health }) {
  const tiles = React.useMemo(() => {
    const s = serverStatus || {};
    const proc = s.process || {};
    const a2s = s.a2s || {};
    const rcon = s.rcon || {};
    const m = metrics || {};
    const h = health || {};
    const errorRate = h.total_requests > 0 ? (h.total_errors / h.total_requests) * 100 : 0;
    const fmtUp = (sec) => { if (!sec && sec !== 0) return "\u2014"; const hrs = Math.floor(sec / 3600); const mins = Math.floor((sec % 3600) / 60); return hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`; };
    return [
      { name: "GAME SERVER", level: proc.running ? "green" : "red", metric: proc.running ? `UP ${fmtUp(proc.uptime_seconds)}` : "DOWN" },
      { name: "RCON", level: rcon.connected ? "green" : "red", metric: rcon.connected ? "CONNECTED" : "DISCONNECTED" },
      { name: "A2S QUERY", level: a2s.online ? "green" : "red", metric: a2s.online ? `${a2s.player_count ?? 0}/${a2s.max_players ?? 0} players` : "OFFLINE" },
      { name: "CPU", level: (m.cpu_percent ?? 0) > 80 ? "red" : (m.cpu_percent ?? 0) > 60 ? "yellow" : "green", metric: `${(m.cpu_percent ?? 0).toFixed(1)}%` },
      { name: "MEMORY", level: (m.memory_percent ?? 0) > 90 ? "red" : (m.memory_percent ?? 0) > 70 ? "yellow" : "green", metric: `${(m.memory_used_mb ?? 0).toFixed(0)} / ${(m.memory_limit_mb ?? 0).toFixed(0)} MB` },
      { name: "API HEALTH", level: errorRate > 10 ? "red" : errorRate > 5 ? "yellow" : "green", metric: h.total_requests > 0 ? `${errorRate.toFixed(1)}% err rate` : "NO TRAFFIC" },
    ];
  }, [serverStatus, metrics, health]);

  const composite = React.useMemo(() => {
    const hasRed = tiles.some(t => t.level === "red");
    const hasYellow = tiles.some(t => t.level === "yellow");
    if (hasRed) return { label: "CRITICAL", color: "#ff4444", glow: "#ff444466" };
    if (hasYellow) return { label: "DEGRADED", color: "#ffaa00", glow: "#ffaa0066" };
    return { label: "OPERATIONAL", color: "#00ff88", glow: "#00ff8866" };
  }, [tiles]);

  const pal = { green: { fill: "#00ff88", glow: "#00ff8855", label: "HEALTHY" }, yellow: { fill: "#ffaa00", glow: "#ffaa0055", label: "DEGRADED" }, red: { fill: "#ff4444", glow: "#ff444455", label: "CRITICAL" } };

  return (
    <div style={{ background: "#0d1a0d", padding: "20px 24px 24px", fontFamily: "JetBrains Mono" }}>
      <div style={{ fontSize: 11, letterSpacing: 2, color: "#00ff88", textTransform: "uppercase", borderBottom: "1px solid rgba(0,255,136,0.15)", paddingBottom: 6, marginBottom: 16 }}>{"\u25A0"} SYSTEM HEALTH</div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10 }}>
        {tiles.map((tile) => {
          const tone = pal[tile.level];
          return (
            <div key={tile.name} style={{ background: "rgba(0,255,136,0.025)", border: `1px solid ${tone.fill}22`, padding: "20px 18px", display: "flex", flexDirection: "column", alignItems: "center", gap: 8 }}>
              <div style={{ fontSize: 10, letterSpacing: 2, color: "#667766", textTransform: "uppercase", fontWeight: 500 }}>{tile.name}</div>
              <div style={{ width: 28, height: 28, borderRadius: "50%", background: tone.fill, boxShadow: `0 0 12px ${tone.glow}, 0 0 24px ${tone.glow}`, animation: tile.level !== "green" ? "pulse 1.8s ease-in-out infinite" : "none", margin: "4px 0" }} />
              <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1.5, color: tone.fill }}>{tone.label}</div>
              <div style={{ fontSize: 11, color: "#556655", textAlign: "center", lineHeight: 1.3 }}>{tile.metric}</div>
            </div>
          );
        })}
      </div>
      <div style={{ marginTop: 16 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          <span style={{ fontSize: 10, letterSpacing: 2, color: "#667766", textTransform: "uppercase" }}>OVERALL STATUS</span>
          <span style={{ fontSize: 14, fontWeight: 700, letterSpacing: 2, color: composite.color, fontFamily: "Rajdhani", textTransform: "uppercase" }}>{composite.label}</span>
        </div>
        <div style={{ width: "100%", height: 6, background: "rgba(0,255,136,0.06)", borderRadius: 3, overflow: "hidden" }}>
          <div style={{ width: "100%", height: "100%", background: composite.color, borderRadius: 3, boxShadow: `0 0 10px ${composite.glow}` }} />
        </div>
      </div>
    </div>
  );
}

// ── Resource Gauges (SVG arcs) ──
function ResourceGauges({ metrics }) {
  const getColor = (pct) => pct >= 80 ? "#ff4444" : pct >= 60 ? "#ffaa00" : "#00ff88";
  const ArcGauge = ({ percent, label, subtitle }) => {
    const clamped = Math.min(100, Math.max(0, percent || 0));
    const color = getColor(clamped);
    const r = 50, cx = 60, cy = 60;
    const circ = 2 * Math.PI * r;
    const arcLen = circ * (270 / 360);
    const offset = arcLen - (arcLen * clamped) / 100;
    const s = (135 * Math.PI) / 180, e = (405 * Math.PI) / 180;
    const path = `M ${cx + r * Math.cos(s)} ${cy + r * Math.sin(s)} A ${r} ${r} 0 1 1 ${cx + r * Math.cos(e)} ${cy + r * Math.sin(e)}`;
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: "1 1 0", minWidth: 110 }}>
        <svg viewBox="0 0 120 120" style={{ width: "100%", maxWidth: 140 }}>
          <path d={path} fill="none" stroke="rgba(0,255,136,0.08)" strokeWidth="8" strokeLinecap="round" />
          <path d={path} fill="none" stroke={color} strokeWidth="8" strokeLinecap="round" strokeDasharray={arcLen} strokeDashoffset={offset} style={{ transition: "stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1), stroke 0.5s ease" }} />
          <text x="60" y="58" textAnchor="middle" dominantBaseline="central" style={{ fontFamily: "Rajdhani", fontWeight: 700, fontSize: "28px", fill: color }}>{Math.round(clamped)}%</text>
          <text x="60" y="82" textAnchor="middle" dominantBaseline="central" style={{ fontFamily: "JetBrains Mono", fontSize: "8px", fill: "rgba(0,255,136,0.6)", textTransform: "uppercase", letterSpacing: "1.5px" }}>{label}</text>
          <text x="60" y="96" textAnchor="middle" dominantBaseline="central" style={{ fontFamily: "JetBrains Mono", fontSize: "6.5px", fill: "rgba(0,255,136,0.35)" }}>{subtitle}</text>
        </svg>
      </div>
    );
  };
  if (!metrics) return (
    <div style={panelStyle}>
      <div style={{ fontSize: 11, color: "#00ff88", letterSpacing: 2, textTransform: "uppercase", fontFamily: "JetBrains Mono", marginBottom: 14, borderBottom: "1px solid rgba(0,255,136,0.15)", paddingBottom: 6 }}>{"\u25A0"} Resource Utilization</div>
      <div style={{ fontSize: 12, color: "#445544", fontFamily: "JetBrains Mono", textAlign: "center", padding: "32px 0" }}>Awaiting metrics data...</div>
    </div>
  );
  const cpu_percent = metrics.cpu_percent ?? 0, memory_percent = metrics.memory_percent ?? 0, memory_used_mb = metrics.memory_used_mb ?? 0, memory_limit_mb = metrics.memory_limit_mb ?? 0, network_rx_mb = metrics.network_rx_mb ?? 0, network_tx_mb = metrics.network_tx_mb ?? 0, disk_read_mb = metrics.disk_read_mb ?? 0, disk_write_mb = metrics.disk_write_mb ?? 0, pids = metrics.pids ?? 0;
  return (
    <div style={panelStyle}>
      <div style={{ fontSize: 11, color: "#00ff88", letterSpacing: 2, textTransform: "uppercase", fontFamily: "JetBrains Mono", marginBottom: 14, borderBottom: "1px solid rgba(0,255,136,0.15)", paddingBottom: 6 }}>{"\u25A0"} Resource Utilization</div>
      <div style={{ display: "flex", justifyContent: "center", alignItems: "flex-start", gap: 12, flexWrap: "wrap" }}>
        <ArcGauge percent={cpu_percent} label="CPU" subtitle={`${cpu_percent.toFixed(1)}% LOAD`} />
        <ArcGauge percent={memory_percent} label="MEMORY" subtitle={`${Math.round(memory_used_mb)} / ${Math.round(memory_limit_mb)} MB`} />
        <ArcGauge percent={Math.min(100, disk_read_mb + disk_write_mb)} label="DISK I/O" subtitle={`R:${disk_read_mb.toFixed(1)} W:${disk_write_mb.toFixed(1)} MB`} />
      </div>
      <div style={{ display: "flex", justifyContent: "center", gap: 24, marginTop: 14, paddingTop: 10, borderTop: "1px solid rgba(0,255,136,0.06)", fontFamily: "JetBrains Mono", fontSize: 10, color: "rgba(0,255,136,0.4)", flexWrap: "wrap" }}>
        <span>NET RX: <span style={{ color: "#00ff88" }}>{network_rx_mb.toFixed(2)} MB</span></span>
        <span>NET TX: <span style={{ color: "#00ff88" }}>{network_tx_mb.toFixed(2)} MB</span></span>
        <span>PIDs: <span style={{ color: "#00ff88" }}>{pids}</span></span>
      </div>
    </div>
  );
}

// ── Uptime Timeline ──
function UptimeTimeline({ serverStatus }) {
  const MAX_PTS = 60;
  const historyRef = useRef([]);
  const [, forceUpdate] = useState(0);
  useEffect(() => {
    if (!serverStatus) return;
    const isUp = serverStatus.process?.running === true;
    const entry = { timestamp: Date.now(), up: isUp };
    const h = historyRef.current;
    const last = h[h.length - 1];
    if (last && Math.abs(last.timestamp - entry.timestamp) < 1000) h[h.length - 1] = entry;
    else h.push(entry);
    if (h.length > MAX_PTS) historyRef.current = h.slice(h.length - MAX_PTS);
    forceUpdate(n => n + 1);
  }, [serverStatus]);

  const history = historyRef.current;
  const segments = React.useMemo(() => {
    const r = [];
    for (let i = 0; i < MAX_PTS - history.length; i++) r.push({ type: "none" });
    for (const h of history) r.push({ type: h.up ? "up" : "down", timestamp: h.timestamp });
    return r;
  }, [history.length, serverStatus]);

  const uptimePct = history.length > 0 ? Math.round((history.filter(h => h.up).length / history.length) * 100) : null;
  const streakInfo = React.useMemo(() => {
    if (history.length === 0) return null;
    const cur = history[history.length - 1].up;
    let start = history.length - 1;
    while (start > 0 && history[start - 1].up === cur) start--;
    return { up: cur, duration: Date.now() - history[start].timestamp, startTime: history[start].timestamp };
  }, [history.length, serverStatus]);
  const fmtDur = (ms) => { const s = Math.floor(ms / 1000); const h = Math.floor(s / 3600); const m = Math.floor((s % 3600) / 60); return h > 0 ? `${h}h ${m}m` : `${m}m ${s % 60}s`; };
  const fmtTs = (t) => new Date(t).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  const pctColor = (p) => p >= 90 ? "#00ff88" : p >= 70 ? "#ffcc00" : "#ff4444";
  const segColor = (t) => t === "up" ? "#00ff88" : t === "down" ? "#ff4444" : "#334433";
  const lastCrash = serverStatus?.process?.last_crash;

  return (
    <div style={panelStyle}>
      <div style={{ fontSize: 11, letterSpacing: 2, color: "#00ff88", fontFamily: "JetBrains Mono", textTransform: "uppercase", marginBottom: 12 }}>{"\u25A0"} Uptime History</div>
      <div style={{ display: "flex", gap: 2, height: 24, marginBottom: 6 }}>
        {segments.map((seg, i) => <div key={i} title={seg.type === "none" ? "No data" : seg.type === "up" ? "Online" : "Offline"} style={{ width: 4, height: 24, borderRadius: 1, background: segColor(seg.type), opacity: seg.type === "none" ? 0.4 : 0.9, flexShrink: 0 }} />)}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9, color: "rgba(0,255,136,0.3)", fontFamily: "JetBrains Mono", marginBottom: 16 }}>
        <span>Last 5 minutes</span><span>Now</span>
      </div>
      <div style={{ display: "flex", alignItems: "baseline", gap: 16, flexWrap: "wrap" }}>
        {uptimePct !== null ? (
          <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
            <span style={{ fontFamily: "Rajdhani", fontSize: 28, fontWeight: 700, color: pctColor(uptimePct), lineHeight: 1 }}>{uptimePct}%</span>
            <span style={{ fontSize: 10, color: "rgba(0,255,136,0.35)", textTransform: "uppercase", letterSpacing: 1 }}>uptime</span>
          </div>
        ) : <span style={{ fontFamily: "Rajdhani", fontSize: 28, fontWeight: 700, color: "#334433" }}>{"\u2014"}%</span>}
        {streakInfo && <div style={{ fontSize: 11, color: streakInfo.up ? "rgba(0,255,136,0.7)" : "rgba(255,68,68,0.8)", borderLeft: "1px solid rgba(0,255,136,0.1)", paddingLeft: 14 }}>{streakInfo.up ? `Up for ${fmtDur(streakInfo.duration)}` : `Down since ${fmtTs(streakInfo.startTime)}`}</div>}
      </div>
      {lastCrash && <div style={{ marginTop: 12, fontSize: 10, color: "rgba(255,68,68,0.5)", fontFamily: "JetBrains Mono" }}>Last incident: {typeof lastCrash === "number" ? fmtTs(lastCrash) : lastCrash}</div>}
    </div>
  );
}

// ── Server Log Stream (SSE + polling fallback) ──
function ServerLogStream() {
  const MAX_LINES = 500;
  const [lines, setLines] = useState([]);
  const [connectionStatus, setConnectionStatus] = useState("disconnected");
  const [paused, setPaused] = useState(false);
  const [autoScroll, setAutoScroll] = useState(true);
  const [filter, setFilter] = useState("");
  const logEndRef = useRef(null);
  const containerRef = useRef(null);
  const eventSourceRef = useRef(null);
  const pollTimerRef = useRef(null);
  const reconnectTimerRef = useRef(null);
  const reconnectAttemptRef = useRef(0);
  const pausedRef = useRef(false);
  const linesRef = useRef([]);
  const lineIdRef = useRef(0);
  const usingPollingRef = useRef(false);
  pausedRef.current = paused;
  linesRef.current = lines;

  const parseLevel = (line) => { const u = (line || "").toUpperCase(); if (u.includes("ERROR") || u.includes("FATAL")) return "error"; if (u.includes("WARN")) return "warn"; return "info"; };
  const appendLines = useCallback((newEntries) => { if (pausedRef.current) return; setLines(prev => { const c = [...prev, ...newEntries]; return c.length > MAX_LINES ? c.slice(c.length - MAX_LINES) : c; }); }, []);

  const startPolling = useCallback(() => {
    if (usingPollingRef.current) return;
    usingPollingRef.current = true;
    setConnectionStatus("connected");
    const poll = async () => {
      if (pausedRef.current) return;
      try {
        const resp = await fetch(`${API_BASE}/api/server/log?lines=100`);
        if (!resp.ok) throw new Error();
        const data = await resp.json();
        const existing = new Set(linesRef.current.map(l => l.message));
        const newE = (data.lines || []).filter(l => !existing.has(l)).map(l => ({ id: ++lineIdRef.current, message: l, timestamp: new Date().toISOString(), level: parseLevel(l) }));
        if (newE.length > 0) appendLines(newE);
        setConnectionStatus("connected");
      } catch { setConnectionStatus("reconnecting"); }
    };
    poll();
    pollTimerRef.current = setInterval(poll, 3000);
  }, [appendLines]);

  const connectSSE = useCallback(() => {
    if (eventSourceRef.current) eventSourceRef.current.close();
    clearInterval(pollTimerRef.current);
    usingPollingRef.current = false;
    setConnectionStatus("reconnecting");
    try {
      const es = new EventSource(`${API_BASE}/api/server/log/stream`);
      eventSourceRef.current = es;
      es.onopen = () => { setConnectionStatus("connected"); reconnectAttemptRef.current = 0; };
      es.onmessage = (event) => { try { const d = JSON.parse(event.data); appendLines([{ id: ++lineIdRef.current, message: d.line || "", timestamp: d.timestamp || new Date().toISOString(), level: (d.level || "info").toLowerCase() }]); } catch {} };
      es.onerror = () => { es.close(); eventSourceRef.current = null; setConnectionStatus("reconnecting"); const att = reconnectAttemptRef.current++; if (att >= 3) { startPolling(); return; } reconnectTimerRef.current = setTimeout(connectSSE, Math.min(1000 * Math.pow(2, att), 30000)); };
    } catch { startPolling(); }
  }, [appendLines, startPolling]);

  useEffect(() => { connectSSE(); return () => { if (eventSourceRef.current) eventSourceRef.current.close(); clearInterval(pollTimerRef.current); clearTimeout(reconnectTimerRef.current); }; }, [connectSSE]);
  useEffect(() => { if (autoScroll && logEndRef.current) logEndRef.current.scrollIntoView({ behavior: "smooth" }); }, [lines, autoScroll]);
  const handleScroll = useCallback(() => { if (!containerRef.current) return; const el = containerRef.current; setAutoScroll(el.scrollHeight - el.scrollTop - el.clientHeight < 40); }, []);

  const filterLower = filter.toLowerCase();
  const visible = filter ? lines.filter(l => l.message.toLowerCase().includes(filterLower)) : lines;
  const lvlColor = (l) => l === "error" ? "#ff4444" : l === "warn" ? "#ffaa00" : "#00ff88";
  const dotColor = { connected: "#00ff88", reconnecting: "#ffaa00", disconnected: "#ff4444" }[connectionStatus] || "#ff4444";
  const fmtTs2 = (s) => { try { return new Date(s).toLocaleTimeString("en-US", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" }); } catch { return "--:--:--"; } };
  const btnBase = (color, active) => ({ background: active ? `${color}28` : `${color}12`, border: `1px solid ${color}${active ? "66" : "33"}`, color, padding: "5px 14px", fontFamily: "JetBrains Mono", fontSize: 10, cursor: "pointer", letterSpacing: 1, textTransform: "uppercase", borderRadius: 3, flexShrink: 0 });

  return (
    <div style={panelStyle}>
      <div style={{ fontSize: 11, letterSpacing: 2, color: "#00ff88", fontFamily: "JetBrains Mono", textTransform: "uppercase", borderBottom: "1px solid rgba(0,255,136,0.15)", paddingBottom: 6, marginBottom: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span>{"\u25A0"} Live Server Logs</span>
        <span style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 10 }}>
          <span style={{ display: "inline-block", width: 7, height: 7, borderRadius: "50%", background: dotColor, boxShadow: `0 0 6px ${dotColor}66`, animation: connectionStatus === "reconnecting" ? "pulse 1.5s ease-in-out infinite" : "none" }} />
          <span style={{ color: dotColor, letterSpacing: 1 }}>{connectionStatus.toUpperCase()}</span>
          <span style={{ color: "#556655", marginLeft: 4 }}>{lines.length} lines</span>
        </span>
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 10, alignItems: "center", flexWrap: "wrap" }}>
        <input type="text" placeholder="Filter logs..." value={filter} onChange={(e) => setFilter(e.target.value)} style={{ flex: 1, minWidth: 120, background: "rgba(0,0,0,0.3)", border: "1px solid rgba(0,255,136,0.15)", color: "#ccddcc", padding: "5px 10px", fontFamily: "JetBrains Mono", fontSize: 11, outline: "none", borderRadius: 3 }} />
        <button onClick={() => setPaused(p => !p)} style={btnBase(paused ? "#ffaa00" : "#00ff88", true)}>{paused ? "\u25B6 Resume" : "\u23F8 Pause"}</button>
        <button onClick={() => setAutoScroll(a => !a)} style={btnBase(autoScroll ? "#00ff88" : "#88bbff", autoScroll)}>{autoScroll ? "Auto-scroll On" : "Auto-scroll Off"}</button>
        <button onClick={() => { setLines([]); lineIdRef.current = 0; }} style={btnBase("#ff4444", false)}>Clear</button>
      </div>
      <div ref={containerRef} onScroll={handleScroll} style={{ maxHeight: 360, overflowY: "auto", background: "rgba(0,0,0,0.25)", border: "1px solid rgba(0,255,136,0.06)", borderRadius: 4 }}>
        {visible.length === 0 ? (
          <div style={{ color: "#445544", fontSize: 12, fontFamily: "JetBrains Mono", padding: "24px 12px", textAlign: "center" }}>{filter ? "No log lines match filter" : "Waiting for log data..."}</div>
        ) : visible.map((entry) => (
          <div key={entry.id} style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "3px 10px", borderBottom: "1px solid rgba(0,255,136,0.03)", fontFamily: "JetBrains Mono", fontSize: 11, lineHeight: 1.5 }}>
            <span style={{ color: "#445544", fontSize: 9, flexShrink: 0, width: 60, paddingTop: 2 }}>{fmtTs2(entry.timestamp)}</span>
            <span style={{ display: "inline-block", fontSize: 8, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", padding: "1px 5px", background: `${lvlColor(entry.level)}18`, color: lvlColor(entry.level), border: `1px solid ${lvlColor(entry.level)}44`, width: 42, textAlign: "center", flexShrink: 0, borderRadius: 2 }}>{entry.level === "warn" ? "WARN" : entry.level.toUpperCase()}</span>
            <span style={{ color: lvlColor(entry.level), flex: 1, wordBreak: "break-all", whiteSpace: "pre-wrap" }}>{entry.message}</span>
          </div>
        ))}
        <div ref={logEndRef} />
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, fontSize: 9, fontFamily: "JetBrains Mono", color: "#445544" }}>
        <span>{filter ? `${visible.length} of ${lines.length} shown` : `${lines.length} / ${MAX_LINES} buffer`}</span>
        <span>{usingPollingRef.current ? "MODE: POLLING" : "MODE: SSE"}{paused ? " | PAUSED" : ""}</span>
      </div>
    </div>
  );
}

// ── Performance Scoreboard ──
function PerformanceScoreboard({ serverStatus, metrics, health }) {
  const scores = React.useMemo(() => {
    const cpu = metrics?.cpu_percent ?? 0;
    const mem = metrics?.memory_percent ?? 0;
    const totalReqs = health?.total_requests ?? 0;
    const totalErrs = health?.total_errors ?? 0;
    const errorRate = totalReqs > 0 ? (totalErrs / totalReqs) * 100 : 0;
    const uptimeSec = health?.uptime_seconds ?? 0;
    return {
      cpuScore: Math.max(0, Math.min(100, 100 - cpu)),
      memScore: Math.max(0, Math.min(100, 100 - mem)),
      reliabilityScore: Math.max(0, Math.min(100, 100 - errorRate * 10)),
      uptimeScore: Math.max(0, Math.min(100, (uptimeSec / 86400) * 100)),
    };
  }, [metrics, health]);

  const overall = (scores.cpuScore + scores.memScore + scores.reliabilityScore + scores.uptimeScore) / 4;
  let grade, gradeColor;
  if (overall >= 95) { grade = "A+"; gradeColor = "#00ff88"; }
  else if (overall >= 85) { grade = "A"; gradeColor = "#00ff88"; }
  else if (overall >= 75) { grade = "B"; gradeColor = "#88ddff"; }
  else if (overall >= 60) { grade = "C"; gradeColor = "#ffcc66"; }
  else if (overall >= 45) { grade = "D"; gradeColor = "#ff8844"; }
  else { grade = "F"; gradeColor = "#ff4444"; }

  const getScoreColor = (s) => s >= 90 ? "#00ff88" : s >= 75 ? "#88ddff" : s >= 60 ? "#ffcc66" : s >= 40 ? "#ff8844" : "#ff4444";
  const bars = [{ label: "CPU SCORE", value: scores.cpuScore }, { label: "MEMORY SCORE", value: scores.memScore }, { label: "RELIABILITY", value: scores.reliabilityScore }, { label: "UPTIME", value: scores.uptimeScore }];
  const fmtN = (n) => n != null ? Number(n).toLocaleString() : "\u2014";
  const ping = serverStatus?.a2s?.ping ?? 0;

  return (
    <div style={panelStyle}>
      <div style={{ fontSize: 11, letterSpacing: 2, color: "#00ff88", fontFamily: "JetBrains Mono", textTransform: "uppercase", marginBottom: 20, paddingBottom: 10, borderBottom: "1px solid rgba(0,255,136,0.06)" }}>{"\u25A0"} Performance Scoreboard</div>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: 24, padding: "16px 0" }}>
        <div style={{ fontSize: 9, letterSpacing: 2, color: "rgba(0,255,136,0.35)", textTransform: "uppercase", marginBottom: 6 }}>Performance Grade</div>
        <div style={{ fontFamily: "Rajdhani", fontSize: 48, fontWeight: 700, lineHeight: 1, color: gradeColor, textShadow: `0 0 20px ${gradeColor}44` }}>{grade}</div>
        <div style={{ fontSize: 10, color: "rgba(0,255,136,0.3)", fontFamily: "JetBrains Mono", marginTop: 4 }}>{overall.toFixed(1)} / 100</div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 24 }}>
        {bars.map(bar => {
          const color = getScoreColor(bar.value);
          return (
            <div key={bar.label} style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 10, letterSpacing: 0.5, color: "rgba(0,255,136,0.45)", width: 130, flexShrink: 0, textTransform: "uppercase", fontFamily: "JetBrains Mono" }}>{bar.label}</span>
              <div style={{ flex: 1, height: 6, background: "rgba(0,255,136,0.04)", borderRadius: 3, overflow: "hidden" }}>
                <div style={{ width: `${Math.max(0, Math.min(100, bar.value))}%`, height: "100%", background: `linear-gradient(90deg, ${color}88, ${color})`, borderRadius: 3, transition: "width 0.6s ease-out" }} />
              </div>
              <span style={{ fontSize: 10, fontWeight: 600, width: 36, textAlign: "right", color, fontFamily: "JetBrains Mono" }}>{Math.round(bar.value)}</span>
            </div>
          );
        })}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, paddingTop: 16, borderTop: "1px solid rgba(0,255,136,0.06)" }}>
        {[{ label: "REQUESTS", value: fmtN(health?.total_requests) }, { label: "COMMANDS", value: fmtN(health?.total_commands_issued) }, { label: "AVG PING", value: `${(ping * 1000).toFixed(1)}ms` }, { label: "PROCESSES", value: fmtN(metrics?.pids) }].map(s => (
          <div key={s.label} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
            <span style={{ fontSize: 8, letterSpacing: 1, color: "rgba(0,255,136,0.3)", textTransform: "uppercase", fontFamily: "JetBrains Mono", textAlign: "center" }}>{s.label}</span>
            <span style={{ fontFamily: "Rajdhani", fontSize: 18, fontWeight: 700, color: "#00ff88", lineHeight: 1 }}>{s.value}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Player Activity Chart ──
function PlayerActivityChart({ currentPlayerCount, maxPlayers }) {
  const historyRef = useRef([]);
  const lastRecordRef = useRef({ count: null, time: 0 });
  const now = Date.now();
  const last = lastRecordRef.current;
  if (currentPlayerCount !== last.count || now - last.time >= 5000) {
    historyRef.current.push({ count: currentPlayerCount, timestamp: now });
    if (historyRef.current.length > 60) historyRef.current = historyRef.current.slice(-60);
    lastRecordRef.current = { count: currentPlayerCount, time: now };
  }
  const history = historyRef.current;
  const stats = React.useMemo(() => {
    if (history.length === 0) return null;
    let peak = -Infinity, min = Infinity, sum = 0, peakIdx = 0;
    history.forEach((h, i) => { sum += h.count; if (h.count > peak) { peak = h.count; peakIdx = i; } if (h.count < min) min = h.count; });
    return { peak, min, avg: Math.round((sum / history.length) * 10) / 10, peakIndex: peakIdx };
  }, [history.length, currentPlayerCount]);
  const barColor = (c) => { const r = maxPlayers > 0 ? c / maxPlayers : 0; return r >= 0.75 ? "#ff4444" : r >= 0.4 ? "#ffaa00" : "#00ff88"; };

  if (!stats) return (
    <div style={panelStyle}>
      <div style={{ fontSize: 11, letterSpacing: 2, color: "#00ff88", fontFamily: "JetBrains Mono", textTransform: "uppercase", borderBottom: "1px solid rgba(0,255,136,0.15)", paddingBottom: 6, marginBottom: 14 }}>{"\u25A0"} Player Activity</div>
      <div style={{ height: 120, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontFamily: "JetBrains Mono", color: "#445544", background: "rgba(0,0,0,0.2)", borderRadius: 4 }}>Collecting player data...</div>
    </div>
  );

  return (
    <div style={panelStyle}>
      <div style={{ fontSize: 11, letterSpacing: 2, color: "#00ff88", fontFamily: "JetBrains Mono", textTransform: "uppercase", borderBottom: "1px solid rgba(0,255,136,0.15)", paddingBottom: 6, marginBottom: 14 }}>{"\u25A0"} Player Activity</div>
      <div style={{ position: "relative", width: "100%", height: 120, background: "rgba(0,0,0,0.25)", borderRadius: 4, overflow: "hidden", display: "flex", alignItems: "flex-end" }}>
        {[0.25, 0.5, 0.75].map(f => <div key={f} style={{ position: "absolute", bottom: `${f * 100}%`, left: 0, right: 0, height: 1, background: "rgba(0,255,136,0.06)", pointerEvents: "none" }} />)}
        {history.map((p, i) => {
          const hPct = maxPlayers > 0 ? Math.max((p.count / maxPlayers) * 100, 1) : 1;
          const c = barColor(p.count);
          return (
            <div key={i} style={{ position: "relative", flex: "0 0 4px", height: `${hPct}%`, display: "flex", flexDirection: "column", alignItems: "center", transition: "height 0.3s ease" }}>
              {i === stats.peakIndex && <div style={{ position: "absolute", top: -3, width: 6, height: 6, borderRadius: "50%", background: "#ffffff", boxShadow: `0 0 6px ${c}`, zIndex: 2 }} />}
              <div style={{ width: "100%", height: "100%", background: c, borderRadius: "1px 1px 0 0", opacity: 0.85 }} />
            </div>
          );
        })}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 12, gap: 12, flexWrap: "wrap" }}>
        {[{ l: "Current", v: `${currentPlayerCount}/${maxPlayers}`, c: barColor(currentPlayerCount) }, { l: "Peak", v: stats.peak, c: "#ff4444" }, { l: "Average", v: stats.avg, c: "#ffaa00" }, { l: "Min", v: stats.min, c: "#00ff88" }].map(s => (
          <div key={s.l}>
            <div style={{ fontSize: 10, color: "#556655", fontFamily: "JetBrains Mono", textTransform: "uppercase", letterSpacing: 1 }}>{s.l}</div>
            <div style={{ fontSize: 14, fontWeight: 600, fontFamily: "Rajdhani", color: s.c, marginTop: 2 }}>{s.v}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Quick Diagnostics ──
function QuickDiagnostics({ fetchJson, serverStatus }) {
  const [checks, setChecks] = useState([
    { name: "API Health", status: "idle", detail: "" },
    { name: "Server Status", status: "idle", detail: "" },
    { name: "RCON Connection", status: "idle", detail: "" },
    { name: "A2S Query", status: "idle", detail: "" },
    { name: "Game State", status: "idle", detail: "" },
    { name: "Server Logs", status: "idle", detail: "" },
    { name: "Config Readable", status: "idle", detail: "" },
    { name: "Docker Available", status: "idle", detail: "" },
  ]);
  const [running, setRunning] = useState(false);
  const [lastRun, setLastRun] = useState(null);

  const updateCheck = (idx, status, detail) => setChecks(prev => prev.map((c, i) => i === idx ? { ...c, status, detail, timestamp: new Date().toLocaleTimeString() } : c));

  const runAll = useCallback(async () => {
    setRunning(true);
    const runners = [
      async () => { try { await fetchJson("/health"); return { ok: true, detail: "200 OK" }; } catch (e) { return { ok: false, detail: e.message }; } },
      async () => { try { const d = await fetchJson("/api/server/status"); return { ok: d.process?.running, detail: d.process?.running ? "Running" : "Not running" }; } catch (e) { return { ok: false, detail: e.message }; } },
      async () => { try { const d = await fetchJson("/api/server/status"); return { ok: d.rcon?.connected, detail: d.rcon?.connected ? "Connected" : "Disconnected" }; } catch (e) { return { ok: false, detail: e.message }; } },
      async () => { try { const d = await fetchJson("/api/server/status"); return { ok: d.a2s?.online, detail: d.a2s?.online ? "Online" : "Offline" }; } catch (e) { return { ok: false, detail: e.message }; } },
      async () => { try { const d = await fetchJson("/api/game-state"); return { ok: !!d, detail: "OK" }; } catch (e) { return { ok: false, detail: e.message }; } },
      async () => { try { const d = await fetchJson("/api/server/log?lines=5"); return { ok: (d.lines || []).length > 0, detail: `${(d.lines || []).length} lines` }; } catch (e) { return { ok: false, detail: e.message }; } },
      async () => { try { const d = await fetchJson("/api/server/config"); return { ok: !d.error, detail: d.error || "Readable" }; } catch (e) { return { ok: false, detail: e.message }; } },
      async () => { const ok = serverStatus?.process?.docker_available !== false; return { ok, detail: ok ? "Available" : "Not available" }; },
    ];
    for (let i = 0; i < runners.length; i++) {
      updateCheck(i, "running", "Running...");
      const result = await runners[i]();
      updateCheck(i, result.ok ? "pass" : "fail", result.detail);
    }
    setLastRun(new Date().toLocaleTimeString());
    setRunning(false);
  }, [fetchJson, serverStatus]);

  const passed = checks.filter(c => c.status === "pass").length;
  const failed = checks.filter(c => c.status === "fail").length;
  const total = checks.length;
  const icons = { idle: { sym: "\u2014", color: "#556655" }, running: { sym: "\u25CF", color: "#ffaa00" }, pass: { sym: "\u2713", color: "#00ff88" }, fail: { sym: "\u2717", color: "#ff4444" } };
  const progress = checks.filter(c => c.status !== "idle").length;

  return (
    <div style={panelStyle}>
      <div style={{ fontSize: 11, letterSpacing: 2, color: "#00ff88", fontFamily: "JetBrains Mono", textTransform: "uppercase", borderBottom: "1px solid rgba(0,255,136,0.15)", paddingBottom: 6, marginBottom: 14, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span>{"\u25A0"} Diagnostics</span>
        {lastRun && <span style={{ fontSize: 9, color: "#556655", letterSpacing: 1 }}>Last run: {lastRun}</span>}
      </div>
      <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 14 }}>
        <button onClick={runAll} disabled={running} style={{ background: "rgba(0,255,136,0.12)", border: "1px solid rgba(0,255,136,0.3)", color: "#00ff88", padding: "6px 18px", fontFamily: "JetBrains Mono", fontSize: 11, cursor: running ? "wait" : "pointer", letterSpacing: 1, textTransform: "uppercase", opacity: running ? 0.6 : 1 }}>{running ? "Running..." : "\u25B8 Run All Checks"}</button>
        {(passed > 0 || failed > 0) && <span style={{ fontSize: 11, fontFamily: "JetBrains Mono", color: failed > 0 ? "#ff4444" : "#00ff88" }}>{passed}/{total} PASSED{failed > 0 ? ` (${failed} FAILED)` : ""}</span>}
      </div>
      {running && <div style={{ height: 4, background: "rgba(0,255,136,0.08)", borderRadius: 2, overflow: "hidden", marginBottom: 10 }}><div style={{ width: `${(progress / total) * 100}%`, height: "100%", background: "#00ff88", borderRadius: 2, transition: "width 0.3s ease" }} /></div>}
      <div>
        {checks.map((check, i) => {
          const ic = icons[check.status];
          return (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "5px 0", borderBottom: "1px solid rgba(0,255,136,0.05)", fontFamily: "JetBrains Mono" }}>
              <span style={{ color: ic.color, fontSize: 14, width: 20, textAlign: "center", flexShrink: 0, animation: check.status === "running" ? "pulse 1s infinite" : "none" }}>{ic.sym}</span>
              <span style={{ fontSize: 12, color: "#ccddcc", flex: 1 }}>{check.name}</span>
              <span style={{ fontSize: 11, color: "#667766" }}>{check.detail}</span>
              {check.timestamp && <span style={{ fontSize: 10, color: "#445544" }}>{check.timestamp}</span>}
              {check.status === "fail" && !running && <button onClick={async () => { updateCheck(i, "running", "Retrying..."); const runners = [() => fetchJson("/health").then(() => ({ ok: true, detail: "200 OK" })).catch(e => ({ ok: false, detail: e.message }))]; const r = await runners[0](); updateCheck(i, r.ok ? "pass" : "fail", r.detail); }} style={{ background: "none", border: "1px solid rgba(255,68,68,0.3)", color: "#ff4444", padding: "1px 8px", fontSize: 9, cursor: "pointer", fontFamily: "JetBrains Mono", flexShrink: 0 }}>retry</button>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

const formatUptime = (seconds) => {
  if (!seconds && seconds !== 0) return "\u2014";
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
};

const syntaxHighlightJson = (json) => {
  const str = JSON.stringify(json, null, 2);
  return str
    .replace(/(".*?")(\s*:\s*)/g, '<span style="color:#00ff88">$1</span>$2')
    .replace(/:\s*(".*?")/g, ': <span style="color:#88bbff">$1</span>')
    .replace(/:\s*(\d+\.?\d*)/g, ': <span style="color:#ffcc66">$1</span>')
    .replace(/:\s*(true|false)/g, ': <span style="color:#ff88aa">$1</span>')
    .replace(/:\s*(null)/g, ': <span style="color:#667766">$1</span>');
};

const RCON_QUICK_ACTIONS = [
  { label: "players", cmd: "players" },
  { label: "#restart", cmd: "#restart" },
  { label: "say", cmd: 'say -1 "Hello"' },
];

const MAX_RCON_HISTORY = 200;

const panelStyle = {
  background: "#0d1a0d",
  border: "1px solid rgba(0,255,136,0.08)",
  borderRadius: 8,
  padding: 18,
};

function ServerStatusPanel({ serverStatus, onAction, busyAction }) {
  const proc = serverStatus?.process || {};
  const a2s = serverStatus?.a2s || {};
  const rcon = serverStatus?.rcon || {};
  const isRunning = proc.running === true;
  const isStarting = busyAction === "server:start" || busyAction === "server:restart";

  let dotColor = "#ff4444";
  let statusLabel = "Stopped";
  if (isStarting) {
    dotColor = "#ffaa00";
    statusLabel = "Starting...";
  } else if (isRunning) {
    dotColor = "#00ff88";
    statusLabel = "Running";
  }

  const maxPlayers = a2s.max_players || 64;
  const currentPlayers = a2s.player_count ?? 0;
  const playerPct = maxPlayers > 0 ? (currentPlayers / maxPlayers) * 100 : 0;

  const confirmAndAct = (action) => {
    if (action === "stop" || action === "restart") {
      const confirmed = window.confirm(`Are you sure you want to ${action} the server?`);
      if (!confirmed) return;
    }
    onAction(action);
  };

  const btnStyle = (color) => ({
    background: `${color}18`,
    border: `1px solid ${color}44`,
    color: color,
    padding: "6px 18px",
    fontFamily: "JetBrains Mono",
    fontSize: 11,
    cursor: busyAction ? "wait" : "pointer",
    letterSpacing: 1,
    textTransform: "uppercase",
    opacity: busyAction ? 0.55 : 1,
  });

  return (
    <div style={panelStyle}>
      <div style={{ fontSize: 11, letterSpacing: 2, color: "#00ff88", fontFamily: "JetBrains Mono", textTransform: "uppercase", marginBottom: 14, borderBottom: "1px solid rgba(0,255,136,0.15)", paddingBottom: 6 }}>
        Server Status
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
        <span style={{
          display: "inline-block", width: 10, height: 10, borderRadius: "50%",
          background: dotColor, boxShadow: `0 0 8px ${dotColor}66`,
          animation: isStarting ? "pulse 1.5s ease-in-out infinite" : "none",
        }} />
        <span style={{ fontSize: 14, fontFamily: "Rajdhani", fontWeight: 600, color: dotColor }}>
          {statusLabel}
        </span>
      </div>

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
        <div style={{ background: "rgba(0,255,136,0.03)", border: "1px solid rgba(0,255,136,0.12)", padding: "10px 14px", flex: 1, minWidth: 90 }}>
          <div style={{ fontSize: 10, color: "#667766", letterSpacing: 1.5, fontFamily: "JetBrains Mono", textTransform: "uppercase" }}>Container</div>
          <div style={{ fontSize: 18, fontWeight: 700, color: "#00ff88", fontFamily: "Rajdhani", marginTop: 2 }}>{proc.container_id ? proc.container_id.slice(0, 12) : "\u2014"}</div>
        </div>
        <div style={{ background: "rgba(0,255,136,0.03)", border: "1px solid rgba(0,255,136,0.12)", padding: "10px 14px", flex: 1, minWidth: 90 }}>
          <div style={{ fontSize: 10, color: "#667766", letterSpacing: 1.5, fontFamily: "JetBrains Mono", textTransform: "uppercase" }}>Uptime</div>
          <div style={{ fontSize: 18, fontWeight: 700, color: "#00ff88", fontFamily: "Rajdhani", marginTop: 2 }}>{formatUptime(proc.uptime_seconds)}</div>
        </div>
        <div style={{ background: "rgba(0,255,136,0.03)", border: "1px solid rgba(0,255,136,0.12)", padding: "10px 14px", flex: 1, minWidth: 90 }}>
          <div style={{ fontSize: 10, color: "#667766", letterSpacing: 1.5, fontFamily: "JetBrains Mono", textTransform: "uppercase" }}>Ping</div>
          <div style={{ fontSize: 18, fontWeight: 700, color: "#00ff88", fontFamily: "Rajdhani", marginTop: 2 }}>{a2s.ping != null ? (a2s.ping * 1000).toFixed(1) + "ms" : "\u2014"}</div>
        </div>
        <div style={{ background: "rgba(0,255,136,0.03)", border: "1px solid rgba(0,255,136,0.12)", padding: "10px 14px", flex: 1, minWidth: 90 }}>
          <div style={{ fontSize: 10, color: "#667766", letterSpacing: 1.5, fontFamily: "JetBrains Mono", textTransform: "uppercase" }}>Restarts</div>
          <div style={{ fontSize: 18, fontWeight: 700, color: (proc.restart_count || 0) > 0 ? "#ffaa00" : "#00ff88", fontFamily: "Rajdhani", marginTop: 2 }}>{proc.restart_count ?? 0}</div>
        </div>
      </div>

      {/* Connection info row */}
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
        <div style={{ background: "rgba(0,255,136,0.03)", border: "1px solid rgba(0,255,136,0.12)", padding: "8px 14px", flex: 1, minWidth: 130 }}>
          <div style={{ fontSize: 10, color: "#667766", letterSpacing: 1.5, fontFamily: "JetBrains Mono", textTransform: "uppercase" }}>Game Port</div>
          <div style={{ fontSize: 14, fontWeight: 600, color: "#00aaff", fontFamily: "JetBrains Mono", marginTop: 2 }}>UDP 2001</div>
        </div>
        <div style={{ background: "rgba(0,255,136,0.03)", border: "1px solid rgba(0,255,136,0.12)", padding: "8px 14px", flex: 1, minWidth: 130 }}>
          <div style={{ fontSize: 10, color: "#667766", letterSpacing: 1.5, fontFamily: "JetBrains Mono", textTransform: "uppercase" }}>RCON</div>
          <div style={{ fontSize: 14, fontWeight: 600, color: rcon.connected ? "#00ff88" : "#ff6644", fontFamily: "JetBrains Mono", marginTop: 2 }}>{rcon.connected ? "Connected" : "Standby"} :19999</div>
        </div>
        <div style={{ background: "rgba(0,255,136,0.03)", border: "1px solid rgba(0,255,136,0.12)", padding: "8px 14px", flex: 1, minWidth: 130 }}>
          <div style={{ fontSize: 10, color: "#667766", letterSpacing: 1.5, fontFamily: "JetBrains Mono", textTransform: "uppercase" }}>A2S Query</div>
          <div style={{ fontSize: 14, fontWeight: 600, color: a2s.online ? "#00ff88" : "#ff6644", fontFamily: "JetBrains Mono", marginTop: 2 }}>{a2s.online ? "Online" : "Offline"} :17777</div>
        </div>
      </div>

      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 10, color: "#667766", letterSpacing: 1, fontFamily: "JetBrains Mono", marginBottom: 4 }}>
          SERVER: <span style={{ color: "#e0e0e0" }}>{a2s.server_name || "\u2014"}</span>
        </div>
        <div style={{ fontSize: 10, color: "#667766", letterSpacing: 1, fontFamily: "JetBrains Mono", marginBottom: 6 }}>
          MAP: <span style={{ color: "#889988" }}>{a2s.map_name || a2s.map || "\u2014"}</span>
          {a2s.game && <> &middot; GAME: <span style={{ color: "#889988" }}>{a2s.game}</span></>}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 12, fontFamily: "JetBrains Mono", color: "#e0e0e0" }}>
            {currentPlayers} / {maxPlayers} players
          </span>
          <div style={{ flex: 1, background: "rgba(0,255,136,0.08)", height: 6, borderRadius: 3, overflow: "hidden" }}>
            <div style={{
              width: `${Math.min(playerPct, 100)}%`, height: "100%",
              background: playerPct > 80 ? "#ff4444" : playerPct > 50 ? "#ffaa00" : "#00ff88",
              borderRadius: 3, transition: "width 0.3s ease",
            }} />
          </div>
        </div>
      </div>

      <div style={{ display: "flex", gap: 8 }}>
        <button disabled={!!busyAction || isRunning} onClick={() => confirmAndAct("start")} style={btnStyle("#00ff88")}>
          {busyAction === "server:start" ? "... Starting" : "Start"}
        </button>
        <button disabled={!!busyAction || !isRunning} onClick={() => confirmAndAct("stop")} style={btnStyle("#ff4444")}>
          {busyAction === "server:stop" ? "... Stopping" : "Stop"}
        </button>
        <button disabled={!!busyAction || !isRunning} onClick={() => confirmAndAct("restart")} style={btnStyle("#ffaa00")}>
          {busyAction === "server:restart" ? "... Restarting" : "Restart"}
        </button>
      </div>
    </div>
  );
}

function RconConsole({ fetchJson }) {
  const [input, setInput] = useState("");
  const [history, setHistory] = useState([]);
  const [cmdHistory, setCmdHistory] = useState([]);
  const [historyIndex, setHistoryIndex] = useState(-1);
  const outputRef = useRef(null);

  const scrollToBottom = useCallback(() => {
    if (outputRef.current) {
      outputRef.current.scrollTop = outputRef.current.scrollHeight;
    }
  }, []);

  useEffect(() => {
    scrollToBottom();
  }, [history, scrollToBottom]);

  const sendCommand = useCallback(async (cmd) => {
    if (!cmd.trim()) return;
    const timestamp = new Date().toLocaleTimeString();
    setHistory((prev) => [...prev, { type: "cmd", text: cmd, time: timestamp }].slice(-MAX_RCON_HISTORY));
    setCmdHistory((prev) => [...prev, cmd].slice(-50));
    setHistoryIndex(-1);
    setInput("");

    try {
      const data = await fetchJson("/api/server/rcon", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command: cmd }),
      });
      const responseTime = new Date().toLocaleTimeString();
      setHistory((prev) => [...prev, { type: "res", text: data.response || data.result || "(no response)", time: responseTime }].slice(-MAX_RCON_HISTORY));
    } catch (e) {
      const errorTime = new Date().toLocaleTimeString();
      setHistory((prev) => [...prev, { type: "err", text: `Error: ${e.message}`, time: errorTime }].slice(-MAX_RCON_HISTORY));
    }
  }, [fetchJson]);

  const handleKeyDown = useCallback((e) => {
    if (e.key === "Enter") {
      sendCommand(input);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (cmdHistory.length === 0) return;
      const newIndex = historyIndex === -1 ? cmdHistory.length - 1 : Math.max(0, historyIndex - 1);
      setHistoryIndex(newIndex);
      setInput(cmdHistory[newIndex]);
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (historyIndex === -1) return;
      const newIndex = historyIndex + 1;
      if (newIndex >= cmdHistory.length) {
        setHistoryIndex(-1);
        setInput("");
      } else {
        setHistoryIndex(newIndex);
        setInput(cmdHistory[newIndex]);
      }
    }
  }, [input, cmdHistory, historyIndex, sendCommand]);

  return (
    <div style={panelStyle}>
      <div style={{ fontSize: 11, letterSpacing: 2, color: "#00ff88", fontFamily: "JetBrains Mono", textTransform: "uppercase", marginBottom: 14, borderBottom: "1px solid rgba(0,255,136,0.15)", paddingBottom: 6 }}>
        RCON Console
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
        {RCON_QUICK_ACTIONS.map((qa) => (
          <button key={qa.label} onClick={() => sendCommand(qa.cmd)} style={{
            background: "rgba(0,255,136,0.06)", border: "1px solid rgba(0,255,136,0.15)",
            color: "#889988", padding: "3px 12px", fontFamily: "JetBrains Mono",
            fontSize: 10, cursor: "pointer", letterSpacing: 0.5,
          }}>
            {qa.label}
          </button>
        ))}
      </div>

      <div ref={outputRef} style={{
        background: "rgba(0,0,0,0.3)", border: "1px solid rgba(0,255,136,0.1)",
        borderRadius: 4, padding: 10, height: 240, overflowY: "auto",
        fontFamily: "JetBrains Mono", fontSize: 11, marginBottom: 10,
      }}>
        {history.length === 0 ? (
          <div style={{ color: "#445544" }}>RCON console ready. Type a command below.</div>
        ) : (
          history.map((entry, i) => (
            <div key={i} style={{ marginBottom: 4, lineHeight: 1.5 }}>
              <span style={{ color: "#445544", fontSize: 10 }}>[{entry.time}] </span>
              {entry.type === "cmd" && (
                <span style={{ color: "#00ff88" }}>&gt; {entry.text}</span>
              )}
              {entry.type === "res" && (
                <span style={{ color: "#e0e0e0", whiteSpace: "pre-wrap" }}>{entry.text}</span>
              )}
              {entry.type === "err" && (
                <span style={{ color: "#ff4444" }}>{entry.text}</span>
              )}
            </div>
          ))
        )}
      </div>

      <div style={{ display: "flex", gap: 8 }}>
        <input
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={handleKeyDown}
          placeholder="Enter RCON command..."
          style={{
            flex: 1, background: "rgba(0,255,136,0.05)", border: "1px solid rgba(0,255,136,0.15)",
            color: "#e0e0e0", padding: "6px 10px", fontSize: 12, fontFamily: "JetBrains Mono",
            outline: "none", borderRadius: 4,
          }}
        />
        <button onClick={() => sendCommand(input)} style={{
          background: "rgba(0,255,136,0.12)", border: "1px solid rgba(0,255,136,0.3)",
          color: "#00ff88", padding: "6px 18px", fontFamily: "JetBrains Mono",
          fontSize: 11, cursor: "pointer", letterSpacing: 1,
        }}>
          Send
        </button>
      </div>
    </div>
  );
}

function ServerConfigViewer({ fetchJson }) {
  const [config, setConfig] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const loadConfig = useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      const data = await fetchJson("/api/server/config");
      setConfig(data);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, [fetchJson]);

  useEffect(() => {
    loadConfig();
  }, [loadConfig]);

  return (
    <div style={panelStyle}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, borderBottom: "1px solid rgba(0,255,136,0.15)", paddingBottom: 6 }}>
        <div style={{ fontSize: 11, letterSpacing: 2, color: "#00ff88", fontFamily: "JetBrains Mono", textTransform: "uppercase" }}>
          Server Configuration
        </div>
        <button onClick={loadConfig} disabled={loading} style={{
          background: "rgba(0,255,136,0.08)", border: "1px solid rgba(0,255,136,0.2)",
          color: "#00ff88", padding: "3px 12px", fontFamily: "JetBrains Mono", fontSize: 10,
          cursor: loading ? "wait" : "pointer", letterSpacing: 1, opacity: loading ? 0.6 : 1,
        }}>
          {loading ? "Loading..." : "Refresh"}
        </button>
      </div>

      {error ? (
        <div style={{ color: "#ff4444", fontSize: 12, fontFamily: "JetBrains Mono", padding: "16px 0", textAlign: "center" }}>
          {error}
        </div>
      ) : config ? (
        <div style={{
          background: "rgba(0,0,0,0.3)", border: "1px solid rgba(0,255,136,0.1)",
          borderRadius: 4, padding: 12, maxHeight: 300, overflowY: "auto",
          fontFamily: "JetBrains Mono", fontSize: 11, lineHeight: 1.6, color: "#e0e0e0",
        }}>
          <pre style={{ margin: 0, whiteSpace: "pre-wrap", wordBreak: "break-word" }}
            dangerouslySetInnerHTML={{ __html: syntaxHighlightJson(config) }}
          />
        </div>
      ) : (
        <div style={{ color: "#556655", fontSize: 12, fontFamily: "JetBrains Mono", padding: "16px 0", textAlign: "center" }}>
          Loading configuration...
        </div>
      )}
    </div>
  );
}

          and the Arma Reforger dedicated server path is configured in your middleware settings.

        <>

            <ServerStatusPanel serverStatus={serverStatus} onAction={onServerAction} busyAction={busyAction} />
            <PlayerListPanel serverStatus={serverStatus} onKick={onKickPlayer} onRefresh={onRefreshPlayers} />
          </div>

            <RconConsole fetchJson={fetchJson} />
            <ServerConfigViewer fetchJson={fetchJson} />
