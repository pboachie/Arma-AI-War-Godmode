services:
  # Historical combined stack. The supported VPS installer uses ../compose.yml.
  godmode:
    profiles: [legacy]
    build:
      context: ..
      dockerfile: docker/Dockerfile.combined
    ports:
      - "127.0.0.1:${ARMA_GAME_PORT:-2001}:2001/udp"
      - "127.0.0.1:${GODMODE_PORT:-8080}:8000"
    environment:
      # ── Arma Server ──
      - CONFIG=${CONFIG:-config}
      - MAX_FPS=${MAX_FPS:-60}
      - MAX_RESTARTS=${MAX_RESTARTS:-0}
      - FREEZE_CHECK=${FREEZE_CHECK:-300}
      - USE_EXPERIMENTAL=${USE_EXPERIMENTAL:-false}
      - STARTUP_PARAMETERS=${STARTUP_PARAMETERS:-}
      - ARMA_LOCAL_ADDON_ENABLED=${ARMA_LOCAL_ADDON_ENABLED:-false}
      - ARMA_LOCAL_ADDON_NAME=${ARMA_LOCAL_ADDON_NAME:-AIWar}
      - ARMA_LOCAL_ADDON_ID=${ARMA_LOCAL_ADDON_ID:-}
      - GODMODE_API_KEY=${GODMODE_API_KEY:-}
      - GODMODE_GAME_API_KEY=${GODMODE_GAME_API_KEY:-}
      - CORS_ORIGINS=
      # ── LLM Provider ──
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - GLM_BASE_URL=${GLM_BASE_URL:-https://api.z.ai/api/coding/paas/v4/}
      - GLM_TEMPERATURE=${GLM_TEMPERATURE:-0.8}
      - LLM_PROVIDER=${LLM_PROVIDER:-disabled}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2000}
      - MAX_HISTORY=${MAX_HISTORY:-20}
      - MAX_CONCURRENT_LLM=${MAX_CONCURRENT_LLM:-2}
      - MAX_MEMORY_MESSAGES=${MAX_MEMORY_MESSAGES:-100}
      - MEMORY_TOKEN_LIMIT=${MEMORY_TOKEN_LIMIT:-128000}
      - COMPACTION_THRESHOLD=${COMPACTION_THRESHOLD:-100}
      - FALLBACK_PROVIDER=${FALLBACK_PROVIDER:-}
      - FALLBACK_MODEL=${FALLBACK_MODEL:-}
      # ── Connection (localhost — same container) ──
      - ARMA_RCON_CONNECT_ADDRESS=127.0.0.1
      - ARMA_A2S_CONNECT_ADDRESS=127.0.0.1
      - ARMA_RCON_PORT=19999
      - ARMA_A2S_PORT=17777
      - RCON_ENABLED=false
      - SERVER_CONTROL_ENABLED=false
      # ── Process mode (detect game server via pgrep, not Docker CLI) ──
      - GODMODE_PROCESS_MODE=true
    volumes:
      # Arma server configs
      - type: bind
        source: "../Arma Reforger Server/configs"
        target: /home/reforger/configs
        read_only: true
      # Local addon sources (read-only)
      - type: bind
        source: ${ARMA_LOCAL_SCRIPTS_SOURCE:-../scripts/Game}
        target: /mnt/godmode-source/scripts/Game
        read_only: true
      - type: bind
        source: ${ARMA_LOCAL_CONFIGS_SOURCE:-../Configs/GodMode}
        target: /mnt/godmode-source/Configs/GodMode
        read_only: true
      # Persistent named volumes
      - arma-steamcmd:/home/reforger/steamcmd
      - arma-steam:/home/reforger/Steam
      - arma-install:/home/reforger/reforger_bins
      - arma-profile:/home/reforger/profile
      - arma-workshop:/home/reforger/workshop
      - godmode-replays:/app/replays
      - godmode-battles:/app/battle_summaries
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  arma-steamcmd:
  arma-steam:
  arma-install:
  arma-profile:
  arma-workshop:
  godmode-replays:
  godmode-battles:
